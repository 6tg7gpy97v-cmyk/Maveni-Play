<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop Stable</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation;background:#83ddff}button{font:inherit}#game{position:fixed;inset:0;overflow:hidden}.scene{position:absolute;inset:0;pointer-events:none}.sky{position:absolute;inset:0}.meadowSky{background:linear-gradient(#82ddff 0 62%,#7bdd62 62%)}.beachSky{background:linear-gradient(#8ddfff 0 48%,#39bde3 48% 79%,#f0cf72 79%)}.moonSky{background:linear-gradient(#17213f 0 58%,#274a35 58%)}#hud{position:absolute;z-index:30;top:10px;left:8px;right:8px;display:flex;justify-content:space-between;gap:4px}.pill{background:#fff;border-radius:15px;padding:7px 8px;font-size:14px;font-weight:900;color:#17324d}#world{position:absolute;z-index:30;top:52px;left:50%;transform:translateX(-50%);font-weight:900;color:#fff;text-shadow:0 2px 4px #0008;white-space:nowrap}#mission{position:absolute;z-index:30;top:78px;left:12px;right:12px;background:#ffffffdd;border-radius:14px;padding:8px 10px;color:#17324d;font-size:13px;font-weight:900}#field{position:absolute;inset:0;z-index:10;overflow:hidden}.wrap{position:absolute;width:126px;height:126px;display:flex;align-items:center;justify-content:center;touch-action:none}.critter{width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:58px;filter:drop-shadow(0 5px 3px #0003);border-radius:50%;animation:bob .8s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-14px)}}.rare{background:#e7f3ff;box-shadow:0 0 18px #7ac7ff}.epic{background:#f3e4ff;box-shadow:0 0 22px #d78cff}.legendary{background:#fff3ae;box-shadow:0 0 28px #ffd21c}.overlay{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:#0008}.overlay.show{display:flex}.panel{width:min(92vw,430px);background:#fff;border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:38px;margin:0 0 10px;color:#ff5678}.sub{font-size:17px;line-height:1.4;font-weight:800;color:#17324d}.bigbtn,.smallbtn{border:0;border-radius:18px;background:#ffd348;color:#392e00;font-weight:900;box-shadow:0 6px 0 #dba91d}.bigbtn{display:block;width:90%;margin:16px auto;padding:16px;font-size:21px}.smallbtn{padding:11px 16px;margin:7px}.banner{position:absolute;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border-radius:22px;padding:16px 20px;font-size:23px;font-weight:900;color:#ff5678;text-align:center}.float{position:absolute;z-index:65;color:#fff;font-size:24px;font-weight:900;text-shadow:0 2px 5px #0008}#progressWrap{position:absolute;z-index:30;bottom:18px;left:14px;right:14px;height:27px;background:#ffffffdd;border:3px solid white;border-radius:18px;overflow:hidden}#progress{height:100%;background:linear-gradient(90deg,#ffd84c,#ff8a4c);width:0}#goal{position:absolute;z-index:31;bottom:22px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#17324d}#bigEgg{font-size:110px;margin:12px}</style></head><body><div id="game"><div class="scene"><div id="sky" class="sky meadowSky"></div></div><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">34</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">LV <span id="level">1</span></div></div><div id="world">🌳 Sunny Meadow</div><div id="mission">Catch critters!</div><div id="field"></div><div id="progressWrap"><div id="progress"></div></div><div id="goal">0 / 14 ⭐</div><div id="start" class="overlay show"><div class="panel"><h1>Critter Pop!</h1><div class="sub">Tap the friendly critters, collect stars and discover new worlds.</div><div style="font-size:50px;margin:15px">🐰 🐠 🦊 🦄</div><button id="play" class="bigbtn">PLAY</button></div></div><div id="complete" class="overlay"><div class="panel"><h1>🎉 Level Complete!</h1><div id="completeText" class="sub"></div><button id="eggBtn" class="smallbtn" style="display:none">🥚 Hatch Egg</button><button id="nextBtn" class="bigbtn">NEXT LEVEL</button></div></div><div id="hatch" class="overlay"><div class="panel"><h1>🥚 Egg Time!</h1><div id="hatchText" class="sub">Tap the egg to hatch it!</div><div id="bigEgg">🥚</div><button id="hatchBack" class="bigbtn" style="display:none">BACK</button></div></div></div><script>const C=[[['🐰','Common'],['🐸','Common'],['🐱','Rare'],['🐶','Rare']],[['🐢','Common'],['🐙','Rare'],['🐠','Common'],['🦀','Epic']],[['🦊','Common'],['🦉','Rare'],['🦇','Epic'],['🦄','Legendary']]];const W=[['🌳 Sunny Meadow','meadowSky'],['🏖️ Bubble Beach','beachSky'],['🌙 Moonlight Forest','moonSky']];const $=x=>document.getElementById(x),field=$('field');let level=1,score=0,time=34,lives=3,target=14,running=false,transitioning=false,pendingEgg=false,spawnTimer=null,tickTimer=null,hatchStage=0,nextLocked=false;function clearTimers(){if(spawnTimer){clearInterval(spawnTimer);spawnTimer=null}if(tickTimer){clearInterval(tickTimer);tickTimer=null}}function hideOverlays(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'))}function setWorld(){const w=(level-1)%3;$('sky').className='sky '+W[w][1];$('world').textContent=W[w][0]}function update(){$('score').textContent=score;$('time').textContent=time;$('lives').textContent=lives;$('level').textContent=level;$('progress').style.width=Math.min(100,score/target*100)+'%';$('goal').textContent=score+' / '+target+' ⭐';$('mission').textContent='Mission: Catch '+Math.min(target,8)+' friendly critters!'}function banner(t){const b=document.createElement('div');b.className='banner';b.textContent=t;field.appendChild(b);setTimeout(()=>b.isConnected&&b.remove(),700)}function rarityClass(r){return r==='Legendary'?'legendary':r==='Epic'?'epic':r==='Rare'?'rare':''}function spawn(){if(!running||transitioning)return;const w=(level-1)%3,r=Math.random();let type='good',icon,rar='Common';if(r<.07){type='bad';icon='⛈️'}else if(r<.13){type='egg';icon='🥚'}else{const c=C[w][Math.floor(Math.random()*C[w].length)];icon=c[0];rar=c[1]}const wrap=document.createElement('div');wrap.className='wrap';wrap.style.left=(8+Math.random()*Math.max(10,innerWidth-136))+'px';wrap.style.top=(125+Math.random()*Math.max(100,innerHeight-390))+'px';const d=document.createElement('div');d.className='critter '+rarityClass(rar);d.textContent=icon;wrap.appendChild(d);wrap.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(!running||transitioning||wrap.dataset.hit==='1')return;wrap.dataset.hit='1';if(type==='bad'){lives--;banner('Oops! -❤️')}else if(type==='egg'){pendingEgg=true;banner('Egg found! 🥚')}else{score++;}wrap.remove();update();if(lives<=0){endGame();return}if(score>=target)completeLevel()},{passive:false});field.appendChild(wrap);setTimeout(()=>wrap.isConnected&&wrap.remove(),3300)}function beginLevel(){clearTimers();field.innerHTML='';hideOverlays();transitioning=false;nextLocked=false;pendingEgg=false;score=0;time=34;target=14+(level-1)*3;running=true;setWorld();update();spawn();spawnTimer=setInterval(spawn,1100);tickTimer=setInterval(()=>{if(!running)return;time--;update();if(time<=0)endGame()},1000)}function start(){level=1;lives=3;beginLevel()}function completeLevel(){if(!running||transitioning)return;running=false;transitioning=true;clearTimers();field.innerHTML='';$('completeText').textContent='Great job! You finished Level '+level+'.';$('eggBtn').style.display=pendingEgg?'inline-block':'none';$('nextBtn').disabled=false;$('complete').classList.add('show')}function nextLevel(){if(!transitioning||nextLocked)return;nextLocked=true;$('nextBtn').disabled=true;level++;beginLevel()}function showHatch(){if(!transitioning)return;hatchStage=0;$('hatchText').textContent='Tap the egg to hatch it!';$('bigEgg').textContent='🥚';$('hatchBack').style.display='none';$('complete').classList.remove('show');$('hatch').classList.add('show')}function hatchTap(){if(!transitioning)return;hatchStage++;if(hatchStage===1){$('bigEgg').textContent='🥚';$('hatchText').textContent='CRACK... tap again!'}else if(hatchStage===2){$('bigEgg').textContent='🐣';$('hatchText').textContent='Almost there! Tap again!'}else{const w=(level-1)%3,c=C[w][Math.floor(Math.random()*C[w].length)];$('bigEgg').textContent=c[0];$('hatchText').textContent='🎉 You hatched a '+c[1]+' critter!';$('hatchBack').style.display='block'}}function backFromHatch(){if(!transitioning)return;$('hatch').classList.remove('show');$('complete').classList.add('show');$('eggBtn').style.display='none';pendingEgg=false}function endGame(){running=false;transitioning=true;clearTimers();field.innerHTML='';$('completeText').textContent='Time is up! You reached Level '+level+'.';$('eggBtn').style.display='none';$('nextBtn').textContent='PLAY AGAIN';$('complete').classList.add('show');$('nextBtn').onclick=()=>{ $('nextBtn').textContent='NEXT LEVEL'; start(); }}$('play').onclick=start;$('nextBtn').onclick=nextLevel;$('eggBtn').onclick=showHatch;$('bigEgg').onclick=hatchTap;$('hatchBack').onclick=backFromHatch;update();</script></body></html>
