<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop V2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation;background:#8fe8ff}button{font:inherit}.world{position:fixed;inset:0;overflow:hidden;transition:background .5s}#game.meadow{background:linear-gradient(#82ddff 0%,#c8f8ff 62%,#7bdd62 63%,#49b74a 100%)}#game.beach{background:linear-gradient(#77dbff 0%,#bceeff 48%,#54c8ed 49%,#218fca 74%,#f4d77e 75%,#e8bf5d 100%)}#game.moon{background:linear-gradient(#17234d 0%,#32467f 63%,#213b39 64%,#122821 100%)}#hud{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:4px}.pill{background:#fff;border-radius:16px;padding:7px 9px;font-size:15px;font-weight:900;color:#17324d;box-shadow:0 4px 10px #0002}#worldName{position:absolute;z-index:28;top:52px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:900;color:white;text-shadow:0 2px 4px #0008;white-space:nowrap}#combo{position:absolute;z-index:35;top:76px;left:50%;transform:translateX(-50%);font-size:23px;font-weight:900;color:#ff5b72;text-shadow:0 2px white;min-height:30px;white-space:nowrap}#field{position:absolute;inset:0;z-index:10;overflow:hidden}.critter{position:absolute;width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:58px;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 5px 3px #0003);animation:bob .8s ease-in-out infinite alternate;will-change:transform,left,top}.moveR{animation:bob .8s ease-in-out infinite alternate,slideR 2.8s linear forwards}.moveL{animation:bob .8s ease-in-out infinite alternate,slideL 2.8s linear forwards}.hop{animation:hop 1s ease-in-out infinite alternate}.gold{background:radial-gradient(circle,#fff8a8,#ffd633 55%,#ffad00);border-radius:50%;box-shadow:0 0 22px #ffe100;font-size:52px}.power{background:#fff;border-radius:50%;box-shadow:0 0 18px #fff;font-size:48px}.egg{background:radial-gradient(circle,#fff,#ffe7ef 65%,#ffc0d3);border-radius:48% 48% 52% 52%;box-shadow:0 0 20px #fff;font-size:52px}@keyframes bob{from{transform:translateY(-3px) rotate(-2deg)}to{transform:translateY(4px) rotate(2deg)}}@keyframes hop{from{transform:translateY(0) scale(1)}to{transform:translateY(-24px) scale(1.05)}}@keyframes slideR{from{left:-90px}to{left:calc(100% + 10px)}}@keyframes slideL{from{left:calc(100% + 10px)}to{left:-90px}}#progressWrap{position:absolute;z-index:30;bottom:max(16px,env(safe-area-inset-bottom));left:14px;right:14px;height:27px;background:#ffffffd9;border:3px solid white;border-radius:18px;overflow:hidden;box-shadow:0 5px 12px #0002}#progress{height:100%;width:0;background:linear-gradient(90deg,#ffd84c,#ff8a4c);transition:width .2s}#goal{position:absolute;z-index:31;bottom:max(20px,calc(env(safe-area-inset-bottom) + 4px));left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#17324d;pointer-events:none}#overlay,#bookOverlay,#hatchOverlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:#7adfff}#bookOverlay,#hatchOverlay{display:none;background:#0007}.panel{width:min(94vw,430px);max-height:90vh;overflow:auto;background:white;border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:43px;line-height:1;margin:0 0 10px;color:#ff5678}.sub{font-size:17px;line-height:1.35;font-weight:bold;color:#17324d}.animals{font-size:46px;margin:14px 0}.bigbtn,.smallbtn{border:0;border-radius:20px;background:#ffd348;color:#392e00;font-weight:900;box-shadow:0 6px 0 #dba91d}.bigbtn{display:block;width:90%;margin:14px auto 0;padding:17px 10px;font-size:23px}.smallbtn{padding:11px 14px;font-size:16px;margin:6px}#result{font-size:17px;font-weight:bold;color:#17324d;margin-top:14px;line-height:1.4}.float{position:absolute;z-index:50;color:white;font-size:27px;font-weight:900;text-shadow:0 2px 5px #0008;pointer-events:none}.banner{position:absolute;z-index:60;left:50%;top:40%;transform:translate(-50%,-50%);background:#ffffffee;border-radius:25px;padding:16px 22px;font-size:26px;font-weight:900;color:#ff5678;text-align:center;box-shadow:0 10px 30px #0003;pointer-events:none}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.slot{background:#eef7ff;border-radius:18px;padding:10px 4px;min-height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;color:#17324d}.slot .e{font-size:34px}.slot.locked{filter:grayscale(1);opacity:.45}.slot small{font-size:11px;margin-top:4px}.spark{animation:pulse .55s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.14);filter:drop-shadow(0 0 14px #fff)}}#topButtons{position:absolute;z-index:40;right:8px;top:98px;display:flex;gap:6px;flex-direction:column}.round{width:44px;height:44px;border:0;border-radius:50%;background:#ffffffdf;font-size:22px;box-shadow:0 4px 10px #0002}</style></head><body><div id="game" class="world meadow"><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">30</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">LV <span id="level">1</span></div></div><div id="worldName">🌳 Sunny Meadow</div><div id="combo"></div><div id="topButtons"><button class="round" id="bookBtn">📖</button><button class="round" id="soundBtn">🔊</button></div><div id="field"></div><div id="progressWrap"><div id="progress"></div></div><div id="goal">0 / 15 ⭐</div><div id="overlay"><div class="panel"><h1>Critter Pop! V2</h1><div class="sub">Catch moving critters, find eggs and fill your Critter Book!</div><div class="animals">🐰 🐸 🐱 🦊 🐼</div><button id="play" class="bigbtn">PLAY</button><button id="bookMenu" class="smallbtn">📖 Critter Book</button><div id="result"></div></div></div><div id="bookOverlay"><div class="panel"><h1 style="font-size:34px">Critter Book</h1><div class="sub"><span id="bookCount">0</span> / 12 discovered</div><div id="bookGrid" class="bookgrid"></div><button id="closeBook" class="bigbtn">BACK</button></div></div><div id="hatchOverlay"><div class="panel"><h1 style="font-size:36px">🥚 Egg Time!</h1><div id="hatchText" class="sub">Tap the egg to hatch it!</div><div id="bigEgg" class="spark" style="font-size:110px;margin:18px">🥚</div><button id="skipHatch" class="smallbtn">Later</button></div></div></div><script>const critters=[{e:'🐰',n:'Bouncy',w:0},{e:'🐸',n:'Hoppy',w:0},{e:'🐱',n:'Mittens',w:0},{e:'🦊',n:'Flick',w:2},{e:'🐼',n:'Pogo',w:0},{e:'🐶',n:'Patches',w:0},{e:'🐢',n:'Shelly',w:1},{e:'🐙',n:'Squiggles',w:1},{e:'🐠',n:'Bubbles',w:1},{e:'🦀',n:'Snappy',w:1},{e:'🦉',n:'Twinkle',w:2},{e:'🦄',n:'Starshine',w:2}];const bad=['⛈️','🌩️'];const worlds=[{c:'meadow',name:'🌳 Sunny Meadow'},{c:'beach',name:'🏖️ Bubble Beach'},{c:'moon',name:'🌙 Moonlight Forest'}];let score=0,timeLeft=30,lives=3,combo=0,level=1,target=15,doubleUntil=0,running=false,spawnTimer,tickTimer,soundOn=true,foundEggs=0,pendingEgg=false,discovered=new Set(JSON.parse(localStorage.getItem('critterBook')||'[]'));const $=id=>document.getElementById(id),field=$('field'),overlay=$('overlay'),play=$('play'),result=$('result'),comboEl=$('combo'),progress=$('progress'),goal=$('goal'),game=$('game');let audioCtx=null;function beep(freq=600,d=.08,type='sine'){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.05;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}function saveBook(){localStorage.setItem('critterBook',JSON.stringify([...discovered]))}function renderBook(){const grid=$('bookGrid');grid.innerHTML='';critters.forEach((c,i)=>{const unlocked=discovered.has(i),d=document.createElement('div');d.className='slot'+(unlocked?'':' locked');d.innerHTML='<div class="e">'+(unlocked?c.e:'❓')+'</div><small>'+(unlocked?c.n:'Unknown')+'</small>';grid.appendChild(d)});$('bookCount').textContent=discovered.size}function update(){ $('score').textContent=score;$('time').textContent=timeLeft;$('lives').textContent=lives;$('level').textContent=level;progress.style.width=Math.min(100,(score/target)*100)+'%';goal.textContent=score+' / '+target+' ⭐';comboEl.textContent=combo>=3?(combo>=10?'🌈 '+combo+'x CRITTER CRAZY!':combo>=5?'🔥 '+combo+'x SUPER COMBO!':'✨ '+combo+'x COMBO!'):''}function setWorld(){const w=(level-1)%3;game.className='world '+worlds[w].c;$('worldName').textContent=worlds[w].name}function clearField(){field.innerHTML=''}function feedback(x,y,text){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';field.appendChild(f);let t=y,o=1;const a=setInterval(()=>{t-=4;o-=.07;f.style.top=t+'px';f.style.opacity=o;if(o<=0){clearInterval(a);f.remove()}},35)}function banner(text,ms=900){const b=document.createElement('div');b.className='banner';b.innerHTML=text;field.appendChild(b);setTimeout(()=>b.remove(),ms)}function discover(idx){if(!discovered.has(idx)){discovered.add(idx);saveBook();banner('🎉 NEW CRITTER!<br>'+critters[idx].e+' '+critters[idx].n,1200);beep(880,.12);setTimeout(()=>beep(1180,.14),120)}}function hit(el,type,data,e){e?.preventDefault();if(!running||!el.isConnected)return;const x=el.offsetLeft+15,y=el.offsetTop;if(type==='bad'){lives--;combo=0;feedback(x,y,'-❤️');beep(120,.18,'sawtooth');navigator.vibrate?.(100)}else if(type==='heart'){lives=Math.min(5,lives+1);feedback(x,y,'+❤️');banner('EXTRA HEART! ❤️');beep(700,.1)}else if(type==='time'){timeLeft+=5;feedback(x,y,'+5 ⏱️');banner('+5 SECONDS! ⏰');beep(760,.1)}else if(type==='double'){doubleUntil=Date.now()+7000;feedback(x,y,'2× ⭐');banner('DOUBLE STARS! ⭐⭐');beep(900,.12)}else if(type==='egg'){pendingEgg=true;foundEggs++;banner('YOU FOUND AN EGG! 🥚');beep(980,.14);el.remove();return}else{combo++;let pts=type==='gold'?5:1;if(Date.now()<doubleUntil)pts*=2;score+=pts;feedback(x,y,'+'+pts+' ⭐');beep(type==='gold'?1100:620,.07);if(type==='gold')banner('GOLDEN CRITTER! ✨');if(data!=null&&Math.random()<.28)discover(data)}update();el.remove();if(lives<=0)return endGame();if(score>=target)return levelComplete()}function spawn(){if(!running)return;let roll=Math.random(),type='good',icon,idx=null;const world=(level-1)%3;if(roll<.08){type='bad';icon=bad[Math.floor(Math.random()*bad.length)]}else if(roll<.13){const p=Math.random();type=p<.34?'heart':p<.67?'time':'double';icon=type==='heart'?'❤️':type==='time'?'⏰':'🌈'}else if(roll<.17){type='egg';icon='🥚'}else{const pool=critters.map((c,i)=>c.w===world?i:-1).filter(i=>i>=0);idx=pool[Math.floor(Math.random()*pool.length)];icon=critters[idx].e;if(roll<.23)type='gold'}const d=document.createElement('div');d.className='critter'+(type==='gold'?' gold':(['heart','time','double'].includes(type)?' power':type==='egg'?' egg':''));d.textContent=type==='gold'?'✨'+icon:icon;const move=Math.random();if(move<.3){d.classList.add('moveR');d.style.top=(110+Math.random()*Math.max(80,innerHeight-330))+'px'}else if(move<.6){d.classList.add('moveL');d.style.top=(110+Math.random()*Math.max(80,innerHeight-330))+'px'}else{d.classList.add('hop');d.style.left=(10+Math.random()*Math.max(10,innerWidth-108))+'px';d.style.top=(105+Math.random()*Math.max(80,innerHeight-330))+'px'}d.addEventListener('pointerdown',e=>hit(d,type,idx,e));field.appendChild(d);setTimeout(()=>d.remove(),type==='gold'?2200:2800)}function beginLevel(){clearInterval(spawnTimer);clearInterval(tickTimer);clearField();score=0;combo=0;timeLeft=32;target=15+(level-1)*4;running=true;setWorld();update();overlay.style.display='none';spawn();spawnTimer=setInterval(spawn,1000);tickTimer=setInterval(()=>{timeLeft--;update();if(timeLeft<=0)endGame()},1000)}function startGame(){level=1;lives=3;doubleUntil=0;pendingEgg=false;result.innerHTML='';beginLevel()}function levelComplete(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();banner('🎉 LEVEL '+level+' COMPLETE!',900);beep(880,.1);setTimeout(()=>{if(pendingEgg){showHatch()}else{level++;beginLevel()}},950)}function endGame(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();overlay.style.display='flex';result.innerHTML='🌟 You reached <b>Level '+level+'</b>!<br>Critters found: <b>'+discovered.size+'/12</b>';play.textContent='PLAY AGAIN';renderBook()}function showHatch(){pendingEgg=false;$('hatchOverlay').style.display='flex';$('bigEgg').textContent='🥚';$('hatchText').textContent='Tap the egg to hatch it!'}function hatch(){const locked=critters.map((c,i)=>discovered.has(i)?-1:i).filter(i=>i>=0);const idx=(locked.length?locked:critters.map((_,i)=>i))[Math.floor(Math.random()*(locked.length||critters.length))];$('bigEgg').textContent='💥';beep(600,.08);setTimeout(()=>{$('bigEgg').textContent=critters[idx].e;$('hatchText').innerHTML='🎉 <b>'+critters[idx].n+'</b> hatched!';discovered.add(idx);saveBook();renderBook();beep(1000,.14);setTimeout(()=>beep(1300,.14),140)},350);setTimeout(()=>{$('hatchOverlay').style.display='none';level++;beginLevel()},1500)}$('bigEgg').addEventListener('pointerdown',hatch);$('skipHatch').addEventListener('click',()=>{$('hatchOverlay').style.display='none';level++;beginLevel()});$('bookBtn').addEventListener('click',()=>{renderBook();$('bookOverlay').style.display='flex'});$('bookMenu').addEventListener('click',()=>{renderBook();$('bookOverlay').style.display='flex'});$('closeBook').addEventListener('click',()=>{$('bookOverlay').style.display='none'});$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';beep(700,.08)});play.addEventListener('click',startGame);play.addEventListener('touchend',e=>{e.preventDefault();startGame()},{passive:false});renderBook();update();</script></body></html>
