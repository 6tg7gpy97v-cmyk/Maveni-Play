<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop V2.5</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation;background:#83ddff}button{font:inherit}#game{position:fixed;inset:0;overflow:hidden}.scene{position:absolute;inset:0;z-index:0;pointer-events:none}.sky{position:absolute;inset:0}.meadowSky{background:linear-gradient(#82ddff 0 62%,#7bdd62 62% 100%)}.beachSky{background:#8ddfff}.moonSky{background:linear-gradient(#101936 0 60%,#14261f 60% 100%)}.sea,.sand,.wave,.moon,.trees,.stars{display:none;position:absolute}.sea{left:0;right:0;top:48%;height:31%;background:linear-gradient(#55cbea,#168fc7)}.sand{left:0;right:0;top:79%;bottom:0;background:linear-gradient(#f6dc8a,#e9bf61)}.wave{left:-10%;right:-10%;top:76%;height:8px;background:#fff9;border-radius:50%}.moon{width:84px;height:84px;border-radius:50%;right:9%;top:14%;background:#fff9d6;box-shadow:0 0 30px #fff6}.stars{inset:0;background-image:radial-gradient(circle at 15% 18%,#fff 0 2px,transparent 2.5px),radial-gradient(circle at 36% 11%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 61% 23%,#fff 0 2px,transparent 2.5px),radial-gradient(circle at 82% 10%,#fff 0 1.5px,transparent 2px)}.trees{left:0;right:0;bottom:12%;height:48%;background:repeating-linear-gradient(98deg,transparent 0 8%,#183a24 8% 12%,transparent 12% 20%)}#game.beach .sea,#game.beach .sand,#game.beach .wave{display:block}#game.moon .moon,#game.moon .trees,#game.moon .stars{display:block}#hud{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:3px}.pill{background:#fff;border-radius:15px;padding:7px 8px;font-size:14px;font-weight:900;color:#17324d}#worldName{position:absolute;z-index:30;top:52px;left:50%;transform:translateX(-50%);font-weight:900;color:#fff;text-shadow:0 2px 4px #0008;white-space:nowrap}#mission{position:absolute;z-index:30;top:78px;left:12px;right:70px;background:#ffffffdd;border-radius:14px;padding:7px 10px;color:#17324d;font-size:13px;font-weight:900}#field{position:absolute;inset:0;z-index:10;overflow:hidden}.wrap{position:absolute;width:128px;height:128px;display:flex;align-items:center;justify-content:center;touch-action:none}.critter{width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:58px;filter:drop-shadow(0 5px 3px #0003);border-radius:50%}.hopper{animation:hop .8s ease-in-out infinite}.stationary{animation:bob .9s ease-in-out infinite alternate}.swimmerWrap{animation:swim 4.4s linear forwards}.scuttleWrap{animation:scuttle 6.4s steps(10,end) forwards}.flutterWrap{animation:fly 4.2s ease-in-out forwards}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}@keyframes bob{to{transform:translateY(-7px) rotate(3deg)}}@keyframes swim{from{transform:translateX(-150px)}50%{transform:translateX(50vw) translateY(-12px)}to{transform:translateX(calc(100vw + 150px))}}@keyframes scuttle{from{transform:translateX(-150px)}to{transform:translateX(calc(100vw + 150px))}}@keyframes fly{from{transform:translate(-150px,10px)}50%{transform:translate(48vw,-20px)}to{transform:translate(calc(100vw + 150px),10px)}}.rare{background:#e7f3ff;box-shadow:0 0 18px #7ac7ff}.epic{background:#f3e4ff;box-shadow:0 0 22px #d78cff;animation:pulse 1s ease-in-out infinite alternate}.legendary{background:#fff3ae;box-shadow:0 0 28px #ffd21c;animation:legend 1s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}@keyframes legend{to{transform:scale(1.1) rotate(4deg);filter:drop-shadow(0 0 12px #fff)}}.egg{background:#fff;box-shadow:0 0 18px #fff;font-size:53px}.bonusStar{font-size:62px;background:#fff8b8;box-shadow:0 0 25px #ffd21c}.overlay{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:#0007}.overlay.show{display:flex}#startOverlay{background:#7adfff}.panel{width:min(94vw,430px);max-height:90vh;overflow:auto;background:#fff;border-radius:27px;padding:21px 17px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:40px;margin:0 0 9px;color:#ff5678}.sub{font-size:16px;line-height:1.35;font-weight:800;color:#17324d}.bigbtn,.smallbtn{border:0;border-radius:19px;background:#ffd348;color:#392e00;font-weight:900;box-shadow:0 6px 0 #dba91d}.bigbtn{display:block;width:90%;margin:13px auto;padding:16px;font-size:21px}.smallbtn{padding:10px 13px;margin:5px}.bookgrid,.homegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.slot{background:#eef7ff;border-radius:16px;padding:9px 3px;min-height:82px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;color:#17324d}.slot.locked{opacity:.4;filter:grayscale(1)}.slot .e{font-size:34px;transition:.2s}.banner{position:absolute;z-index:70;left:50%;top:40%;transform:translate(-50%,-50%);background:#fff;border-radius:22px;padding:16px 20px;font-size:24px;font-weight:900;color:#ff5678;text-align:center}.float{position:absolute;z-index:65;color:#fff;font-size:25px;font-weight:900;text-shadow:0 2px 5px #0008}#topButtons{position:absolute;z-index:40;right:8px;top:78px;display:flex;flex-direction:column;gap:5px}.round{width:45px;height:45px;border:0;border-radius:50%;background:#ffffffdf;font-size:21px}#bigEgg{font-size:115px;margin:15px;animation:wiggle .6s ease-in-out infinite alternate}@keyframes wiggle{to{transform:rotate(7deg)}}#progressWrap{position:absolute;z-index:30;bottom:max(16px,env(safe-area-inset-bottom));left:14px;right:14px;height:27px;background:#ffffffdd;border:3px solid white;border-radius:18px;overflow:hidden}#progress{height:100%;background:linear-gradient(90deg,#ffd84c,#ff8a4c);width:0}#goal{position:absolute;z-index:31;bottom:max(20px,calc(env(safe-area-inset-bottom) + 4px));left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#17324d}#bonusLabel{position:absolute;z-index:35;top:116px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#ffd21c;text-shadow:0 2px 4px #0008;white-space:nowrap}</style></head><body><div id="game" class="meadow"><div class="scene"><div id="sky" class="sky meadowSky"></div><div class="sea"></div><div class="sand"></div><div class="wave"></div><div class="stars"></div><div class="moon"></div><div class="trees"></div></div><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">34</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">LV <span id="level">1</span></div></div><div id="worldName">🌳 Sunny Meadow</div><div id="mission"></div><div id="bonusLabel"></div><div id="topButtons"><button class="round" id="bookBtn">📖</button><button class="round" id="homeBtn">🏡</button></div><div id="field"></div><div id="progressWrap"><div id="progress"></div></div><div id="goal">0 / 14 ⭐</div><div id="startOverlay" class="overlay show"><div class="panel"><h1>Critter Pop! V2.5</h1><div class="sub">Stable levels + varied missions, rarity effects, Critter Home and Star Rush.</div><div style="font-size:48px;margin:14px">🐰 🐠 🦊 🦄</div><button id="play" class="bigbtn">PLAY</button><button id="bookMenu" class="smallbtn">📖 Critter Book</button><button id="homeMenu" class="smallbtn">🏡 Critter Home</button><div id="result" class="sub"></div></div></div><div id="bookOverlay" class="overlay"><div class="panel"><h1 style="font-size:32px">Critter Book</h1><div class="sub"><span id="bookCount">0</span>/12 discovered</div><div id="bookGrid" class="bookgrid"></div><button class="bigbtn close">BACK</button></div></div><div id="homeOverlay" class="overlay"><div class="panel"><h1 style="font-size:32px">🏡 Critter Home</h1><div class="sub">Tap your friends to make them react!</div><div id="homeGrid" class="homegrid"></div><button class="bigbtn close">BACK</button></div></div><div id="hatchOverlay" class="overlay"><div class="panel"><h1 style="font-size:34px">🥚 Egg Time!</h1><div id="hatchText" class="sub">Tap the egg to hatch it!</div><div id="bigEgg">🥚</div><button id="skipHatch" class="smallbtn">Later</button></div></div></div><script>const C=[{e:'🐰',n:'Bouncy',w:0,m:'hopper',r:'Common'},{e:'🐸',n:'Hoppy',w:0,m:'hopper',r:'Common'},{e:'🐱',n:'Mittens',w:0,m:'stationary',r:'Rare'},{e:'🐶',n:'Patches',w:0,m:'hopper',r:'Rare'},{e:'🐢',n:'Shelly',w:1,m:'stationary',r:'Common'},{e:'🐙',n:'Squiggles',w:1,m:'swimmer',r:'Rare'},{e:'🐠',n:'Bubbles',w:1,m:'swimmer',r:'Common'},{e:'🦀',n:'Snappy',w:1,m:'scuttle',r:'Epic'},{e:'🦊',n:'Flick',w:2,m:'hopper',r:'Common'},{e:'🦉',n:'Twinkle',w:2,m:'flutter',r:'Rare'},{e:'🦇',n:'Flappy',w:2,m:'flutter',r:'Epic'},{e:'🦄',n:'Starshine',w:2,m:'hopper',r:'Legendary'}];const W=[['meadow','🌳 Sunny Meadow','meadowSky'],['beach','🏖️ Bubble Beach','beachSky'],['moon','🌙 Moonlight Forest','moonSky']];const $=x=>document.getElementById(x),field=$('field');let level=1,score=0,time=34,lives=3,target=14,running=false,transitioning=false,pendingEgg=false,hatchStage=0,caught=0,spawnTimer=null,tickTimer=null,mission=null,missionCount=0,bonusMode=false,bonusLeft=0,discovered=new Set(JSON.parse(localStorage.getItem('critterBook')||'[]'));function clearTimers(){if(spawnTimer){clearInterval(spawnTimer);spawnTimer=null}if(tickTimer){clearInterval(tickTimer);tickTimer=null}}function save(){localStorage.setItem('critterBook',JSON.stringify([...discovered]))}function setWorld(){const w=(level-1)%3;$('game').className=W[w][0];$('sky').className='sky '+W[w][2];$('worldName').textContent=W[w][1]}function chooseMission(){const options=[{t:'catch',goal:5+Math.min(level,3),label:'Catch critters 🐾'},{t:'gold',goal:1,label:'Catch a golden critter ✨'},{t:'safe',goal:1,label:'Finish without hitting a storm ☀️'}];mission=options[(level-1)%options.length];missionCount=0}function update(){$('score').textContent=score;$('time').textContent=time;$('lives').textContent=lives;$('level').textContent=level;$('progress').style.width=Math.min(100,score/target*100)+'%';$('goal').textContent=score+' / '+target+' ⭐';let extra=mission.t==='catch'?' '+Math.min(missionCount,mission.goal)+'/'+mission.goal:mission.t==='gold'?' '+Math.min(missionCount,1)+'/1':'';$('mission').textContent='Mission: '+mission.label+extra}function banner(t,ms=850){const b=document.createElement('div');b.className='banner';b.innerHTML=t;field.appendChild(b);setTimeout(()=>{if(b.isConnected)b.remove()},ms)}function floatText(el,t){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent=t;f.style.left=r.left+25+'px';f.style.top=r.top+'px';field.appendChild(f);setTimeout(()=>{if(f.isConnected)f.remove()},600)}function rarityClass(r){return r==='Legendary'?'legendary':r==='Epic'?'epic':r==='Rare'?'rare':''}function discover(i){if(i==null||discovered.has(i))return;discovered.add(i);save();banner('🎉 NEW '+C[i].r.toUpperCase()+'!<br>'+C[i].e+' '+C[i].n,1100)}function handleTap(wrap,type,idx,e){if(e){e.preventDefault();e.stopPropagation()}if(!running||transitioning||!wrap.isConnected||wrap.dataset.hit==='1')return;wrap.dataset.hit='1';if(type==='bad'){lives--;if(mission.t==='safe')missionCount=-999;floatText(wrap,'-❤️')}else if(type==='egg'){pendingEgg=true;banner('🥚 EGG FOUND!');wrap.remove();return}else{const pts=bonusMode?2:(type==='gold'?5:1);score+=pts;caught++;if(mission.t==='catch')missionCount++;if(type==='gold'&&mission.t==='gold')missionCount=1;floatText(wrap,'+'+pts+' ⭐');if(idx!=null&&Math.random()<.30)discover(idx)}wrap.remove();update();if(lives<=0){endGame();return}if(!bonusMode&&score>=target)completeLevel()}function spawn(forceStar=false){if(!running||transitioning)return;const w=(level-1)%3,r=Math.random();let type='good',idx=null,icon='⭐',m='stationary';if(forceStar){type='bonus';icon='⭐'}else if(r<.07){type='bad';icon='⛈️'}else if(r<.12){type='egg';icon='🥚'}else{const pool=C.map((c,i)=>c.w===w?i:-1).filter(i=>i>=0);idx=pool[Math.floor(Math.random()*pool.length)];icon=C[idx].e;m=C[idx].m;if(r>.94)type='gold'}const wrap=document.createElement('div');wrap.className='wrap'+(m==='swimmer'?' swimmerWrap':m==='scuttle'?' scuttleWrap':m==='flutter'?' flutterWrap':'');const d=document.createElement('div');d.className='critter '+(m==='hopper'?'hopper':m==='stationary'?'stationary':'')+(idx!=null?' '+rarityClass(C[idx].r):'')+(type==='egg'?' egg':'')+(type==='bonus'?' bonusStar':'');d.textContent=type==='gold'?'✨'+icon:icon;wrap.appendChild(d);if(m==='swimmer'){wrap.style.left='0';wrap.style.top=(innerHeight*.53+Math.random()*innerHeight*.14)+'px'}else if(m==='scuttle'){wrap.style.left='0';wrap.style.top=(innerHeight*.79+Math.random()*innerHeight*.06)+'px'}else if(m==='flutter'){wrap.style.left='0';wrap.style.top=(125+Math.random()*150)+'px'}else{wrap.style.left=(8+Math.random()*Math.max(10,innerWidth-136))+'px';wrap.style.top=(120+Math.random()*Math.max(100,innerHeight-395))+'px'}wrap.addEventListener('pointerup',e=>handleTap(wrap,type,idx,e),{passive:false});field.appendChild(wrap);setTimeout(()=>{if(wrap.isConnected)wrap.remove()},m==='scuttle'?6600:m==='swimmer'?4600:3400)}function beginLevel(){clearTimers();field.innerHTML='';transitioning=false;pendingEgg=false;bonusMode=false;$('bonusLabel').textContent='';score=0;caught=0;time=34;target=14+(level-1)*3;running=true;chooseMission();setWorld();update();document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'));spawn();spawnTimer=setInterval(()=>spawn(false),1050);tickTimer=setInterval(()=>{time--;update();if(time<=0)endGame()},1000)}function start(){level=1;lives=3;beginLevel()}function completeLevel(){if(!running||transitioning)return;transitioning=true;running=false;clearTimers();field.innerHTML='';if(mission.t==='safe'&&missionCount!==-999)missionCount=1;const missionDone=mission.t==='safe'?missionCount===1:missionCount>=mission.goal;banner('🎉 LEVEL '+level+' COMPLETE!'+(missionDone?'<br>✅ Mission complete!':''),900);setTimeout(()=>{if(pendingEgg)showHatch();else goAfterReward()},950)}function showHatch(){hatchStage=0;$('hatchText').textContent='Tap the egg to hatch it!';$('bigEgg').textContent='🥚';$('hatchOverlay').classList.add('show')}function hatch(){if(!transitioning)return;hatchStage++;if(hatchStage===1){$('hatchText').textContent='CRACK... tap again!'}else if(hatchStage===2){$('bigEgg').textContent='🐣';$('hatchText').textContent='CRACK!! One more tap!'}else{const locked=C.map((c,i)=>!discovered.has(i)?i:-1).filter(i=>i>=0),i=locked.length?locked[Math.floor(Math.random()*locked.length)]:Math.floor(Math.random()*C.length);discovered.add(i);save();$('bigEgg').textContent=C[i].e;$('hatchText').innerHTML='🎉 '+C[i].r+' '+C[i].n+'!';setTimeout(()=>{$('hatchOverlay').classList.remove('show');goAfterReward()},1000)}}function goAfterReward(){if(level===3){startBonus()}else{level++;setTimeout(beginLevel,250)}}function startBonus(){clearTimers();field.innerHTML='';transitioning=false;running=true;bonusMode=true;bonusLeft=10;$('bonusLabel').textContent='🌟 STAR RUSH! 10 🌟';spawnTimer=setInterval(()=>spawn(true),500);tickTimer=setInterval(()=>{bonusLeft--;$('bonusLabel').textContent='🌟 STAR RUSH! '+bonusLeft+' 🌟';if(bonusLeft<=0){clearTimers();running=false;bonusMode=false;$('bonusLabel').textContent='';level++;setTimeout(beginLevel,300)}},1000)}function endGame(){running=false;transitioning=true;clearTimers();field.innerHTML='';$('result').innerHTML='You reached <b>Level '+level+'</b>!';$('play').textContent='PLAY AGAIN';$('startOverlay').classList.add('show')}function renderBook(){const g=$('bookGrid');g.innerHTML='';C.forEach((c,i)=>{const u=discovered.has(i),s=document.createElement('div');s.className='slot'+(u?'':' locked');s.innerHTML='<div class="e">'+(u?c.e:'❓')+'</div><small>'+(u?c.n+' · '+c.r:'Unknown')+'</small>';g.appendChild(s)});$('bookCount').textContent=discovered.size}function renderHome(){const g=$('homeGrid');g.innerHTML='';const ids=[...discovered];if(!ids.length){g.innerHTML='<div class="sub" style="grid-column:1/-1">Discover critters and they will live here!</div>';return}ids.forEach(i=>{const s=document.createElement('button');s.className='slot';s.innerHTML='<div class="e">'+C[i].e+'</div><small>'+C[i].n+'</small>';s.onclick=()=>{const e=s.querySelector('.e');const reactions=['💖','⭐','🎵','😄'];const old=e.textContent;e.textContent=reactions[Math.floor(Math.random()*reactions.length)];setTimeout(()=>e.textContent=old,500)};g.appendChild(s)})}$('play').onclick=start;$('bigEgg').onclick=hatch;$('skipHatch').onclick=()=>{$('hatchOverlay').classList.remove('show');goAfterReward()};function openBook(){renderBook();$('bookOverlay').classList.add('show')}function openHome(){renderHome();$('homeOverlay').classList.add('show')}$('bookBtn').onclick=openBook;$('bookMenu').onclick=openBook;$('homeBtn').onclick=openHome;$('homeMenu').onclick=openHome;document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('show'));chooseMission();update();</script></body></html>
