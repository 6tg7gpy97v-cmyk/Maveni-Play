<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop!</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation}#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#8fe8ff 0%,#c8f8ff 62%,#7bdd62 63%,#49b74a 100%)}#hud{position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:#fff;border-radius:18px;padding:8px 11px;font-size:17px;font-weight:900;color:#17324d;box-shadow:0 4px 10px #0002}#combo{position:absolute;z-index:35;top:70px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;color:#ff5b72;text-shadow:0 2px white;min-height:30px;white-space:nowrap}#field{position:absolute;inset:0;z-index:10}.critter{position:absolute;width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:59px;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 5px 3px #0003);animation:bob .8s ease-in-out infinite alternate}.gold{background:radial-gradient(circle,#fff8a8,#ffd633 55%,#ffad00);border-radius:50%;box-shadow:0 0 22px #ffe100;font-size:55px}.power{background:#fff;border-radius:50%;box-shadow:0 0 18px #fff;font-size:49px}@keyframes bob{from{transform:translateY(-3px) rotate(-2deg)}to{transform:translateY(4px) rotate(2deg)}}#progressWrap{position:absolute;z-index:30;bottom:max(18px,env(safe-area-inset-bottom));left:16px;right:16px;height:28px;background:#ffffffcc;border:3px solid white;border-radius:18px;overflow:hidden;box-shadow:0 5px 12px #0002}#progress{height:100%;width:0;background:linear-gradient(90deg,#ffd84c,#ff8a4c);transition:width .2s}#goal{position:absolute;z-index:31;bottom:max(22px,calc(env(safe-area-inset-bottom) + 4px));left:50%;transform:translateX(-50%);font-size:14px;font-weight:900;color:#17324d;pointer-events:none}#overlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:#7adfff}#panel{width:min(92vw,420px);background:white;border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:45px;line-height:1;margin:0 0 10px;color:#ff5678}#subtitle{font-size:18px;line-height:1.35;font-weight:bold;color:#17324d}#animals{font-size:48px;margin:15px 0}#play{display:block;width:90%;margin:14px auto 0;padding:18px 10px;border:0;border-radius:22px;background:#ffd348;color:#392e00;font-size:25px;font-weight:900;box-shadow:0 7px 0 #dba91d;-webkit-appearance:none}#result{font-size:18px;font-weight:bold;color:#17324d;margin-top:15px;line-height:1.4}.float{position:absolute;z-index:50;color:white;font-size:27px;font-weight:900;text-shadow:0 2px 5px #0008;pointer-events:none}.banner{position:absolute;z-index:60;left:50%;top:40%;transform:translate(-50%,-50%);background:#ffffffee;border-radius:25px;padding:18px 24px;font-size:28px;font-weight:900;color:#ff5678;text-align:center;box-shadow:0 10px 30px #0003;pointer-events:none}</style></head><body><div id="game"><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">30</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">LV <span id="level">1</span></div></div><div id="combo"></div><div id="field"></div><div id="progressWrap"><div id="progress"></div></div><div id="goal">0 / 15 ⭐</div><div id="overlay"><div id="panel"><h1>Critter Pop!</h1><div id="subtitle">Catch critters, build combos and fill the star bar!<br>Watch out for storm clouds.</div><div id="animals">🐰 🐸 🐱 🦊 🐼</div><button id="play">PLAY</button><div id="result"></div></div></div></div><script>const good=['🐰','🐸','🐱','🦊','🐼','🐵','🐶','🐨','🦁','🐯','🐙','🦄'],bad=['⛈️','🌩️'];let score=0,timeLeft=30,lives=3,combo=0,level=1,target=15,doubleUntil=0,running=false,spawnTimer,tickTimer;const field=document.getElementById('field'),overlay=document.getElementById('overlay'),play=document.getElementById('play'),result=document.getElementById('result'),comboEl=document.getElementById('combo'),progress=document.getElementById('progress'),goal=document.getElementById('goal');function update(){scoreEl=document.getElementById('score');scoreEl.textContent=score;document.getElementById('time').textContent=timeLeft;document.getElementById('lives').textContent=lives;document.getElementById('level').textContent=level;progress.style.width=Math.min(100,(score/target)*100)+'%';goal.textContent=score+' / '+target+' ⭐';comboEl.textContent=combo>=3?(combo>=10?'🌈 '+combo+'x CRITTER CRAZY!':combo>=5?'🔥 '+combo+'x SUPER COMBO!':'✨ '+combo+'x COMBO!'):''}function clearField(){field.innerHTML=''}function feedback(x,y,text){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';field.appendChild(f);let t=y,o=1;const a=setInterval(()=>{t-=4;o-=.07;f.style.top=t+'px';f.style.opacity=o;if(o<=0){clearInterval(a);f.remove()}},35)}function banner(text){const b=document.createElement('div');b.className='banner';b.innerHTML=text;field.appendChild(b);setTimeout(()=>b.remove(),900)}function hit(el,type,e){e?.preventDefault();if(!running||!el.isConnected)return;const x=el.offsetLeft+15,y=el.offsetTop;if(type==='bad'){lives--;combo=0;feedback(x,y,'-❤️');navigator.vibrate?.(100)}else if(type==='heart'){lives=Math.min(5,lives+1);feedback(x,y,'+❤️');banner('EXTRA HEART! ❤️')}else if(type==='time'){timeLeft+=5;feedback(x,y,'+5 ⏱️');banner('+5 SECONDS! ⏰')}else if(type==='double'){doubleUntil=Date.now()+7000;feedback(x,y,'2× ⭐');banner('DOUBLE STARS! ⭐⭐')}else{combo++;let pts=type==='gold'?5:1;if(Date.now()<doubleUntil)pts*=2;score+=pts;feedback(x,y,'+'+pts+' ⭐');if(type==='gold')banner('GOLDEN CRITTER! ✨')}update();el.remove();if(lives<=0)return endGame(false);if(score>=target)return levelComplete()}function spawn(){if(!running)return;let roll=Math.random(),type='good',icon;if(roll<.09){type='bad';icon=bad[Math.floor(Math.random()*bad.length)]}else if(roll<.14){type='power';const p=Math.random();type=p<.34?'heart':p<.67?'time':'double';icon=type==='heart'?'❤️':type==='time'?'⏰':'🌈'}else if(roll<.20){type='gold';icon='✨'+good[Math.floor(Math.random()*good.length)]}else icon=good[Math.floor(Math.random()*good.length)];const d=document.createElement('div');d.className='critter'+(type==='gold'?' gold':(['heart','time','double'].includes(type)?' power':''));d.textContent=icon;d.style.left=(10+Math.random()*Math.max(10,innerWidth-108))+'px';d.style.top=(95+Math.random()*Math.max(80,innerHeight-300))+'px';d.addEventListener('pointerdown',e=>hit(d,type,e));field.appendChild(d);setTimeout(()=>d.remove(),type==='gold'?1800:2200)}function beginLevel(){clearInterval(spawnTimer);clearInterval(tickTimer);clearField();score=0;combo=0;timeLeft=30;target=15+(level-1)*5;running=true;update();overlay.style.display='none';spawn();spawnTimer=setInterval(spawn,900);tickTimer=setInterval(()=>{timeLeft--;update();if(timeLeft<=0)endGame(false)},1000)}function startGame(){level=1;lives=3;doubleUntil=0;result.innerHTML='';beginLevel()}function levelComplete(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();banner('🎉 LEVEL '+level+' COMPLETE!');setTimeout(()=>{level++;timeLeft=30;beginLevel()},1000)}function endGame(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();overlay.style.display='flex';result.innerHTML='🌟 You reached <b>Level '+level+'</b>!<br>Ready to try again?';play.textContent='PLAY AGAIN'}play.addEventListener('click',startGame);play.addEventListener('touchend',e=>{e.preventDefault();startGame()},{passive:false});update();</script></body></html>
