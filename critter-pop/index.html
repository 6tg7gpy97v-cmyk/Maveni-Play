<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop V2.1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation;background:#8fe8ff}button{font:inherit}#game{position:fixed;inset:0;overflow:hidden}.bg{position:absolute;inset:0;z-index:0}.meadowBg{background:linear-gradient(#82ddff 0 62%,#7bdd62 62% 100%)}.moonBg{background:linear-gradient(#17234d 0 63%,#213b39 63% 100%)}.beachBg{background:#8ddfff}.sea{display:none;position:absolute;left:0;right:0;top:48%;height:31%;background:linear-gradient(#55cbea,#168fc7)}.sand{display:none;position:absolute;left:0;right:0;top:79%;bottom:0;background:linear-gradient(#f6dc8a,#e9bf61)}.wave{display:none;position:absolute;left:-10%;right:-10%;top:76%;height:8px;background:#fff9;border-radius:50%;animation:wave 2s ease-in-out infinite alternate}@keyframes wave{to{transform:translateY(5px)}}#game.beach .sea,#game.beach .sand,#game.beach .wave{display:block}#hud{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:4px}.pill{background:#fff;border-radius:16px;padding:7px 9px;font-size:15px;font-weight:900;color:#17324d;box-shadow:0 4px 10px #0002}#worldName{position:absolute;z-index:28;top:52px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:900;color:white;text-shadow:0 2px 4px #0008;white-space:nowrap}#combo{position:absolute;z-index:35;top:76px;left:50%;transform:translateX(-50%);font-size:23px;font-weight:900;color:#ff5b72;text-shadow:0 2px white;min-height:30px;white-space:nowrap}#field{position:absolute;inset:0;z-index:10;overflow:hidden}.critter{position:absolute;width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:58px;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 5px 3px #0003);will-change:transform}.stationary{animation:bob .8s ease-in-out infinite alternate}.hopper{animation:hop .72s ease-in-out infinite}.flutter{animation:fly 2.6s ease-in-out forwards}.swimmer{animation:swim 2.8s linear forwards}.scuttle{animation:scuttle 2.4s steps(7,end) forwards}.gold{background:radial-gradient(circle,#fff8a8,#ffd633 55%,#ffad00);border-radius:50%;box-shadow:0 0 22px #ffe100;font-size:52px}.power,.egg{background:#fff;border-radius:50%;box-shadow:0 0 18px #fff}.power{font-size:48px}.egg{font-size:52px}@keyframes bob{from{transform:translateY(-3px) rotate(-2deg)}to{transform:translateY(4px) rotate(2deg)}}@keyframes hop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-38px) scale(1.05)}}@keyframes fly{0%{transform:translate(-110px,10px) rotate(-8deg)}25%{transform:translate(20vw,-22px) rotate(5deg)}50%{transform:translate(48vw,12px) rotate(-4deg)}75%{transform:translate(75vw,-18px) rotate(5deg)}100%{transform:translate(calc(100vw + 110px),5px)}}@keyframes swim{from{transform:translateX(-110px) rotate(0)}50%{transform:translateX(50vw) translateY(-12px) rotate(4deg)}to{transform:translateX(calc(100vw + 110px)) rotate(0)}}@keyframes scuttle{from{transform:translateX(-100px) rotate(-5deg)}to{transform:translateX(calc(100vw + 100px)) rotate(5deg)}}#progressWrap{position:absolute;z-index:30;bottom:max(16px,env(safe-area-inset-bottom));left:14px;right:14px;height:27px;background:#ffffffd9;border:3px solid white;border-radius:18px;overflow:hidden}#progress{height:100%;width:0;background:linear-gradient(90deg,#ffd84c,#ff8a4c)}#goal{position:absolute;z-index:31;bottom:max(20px,calc(env(safe-area-inset-bottom) + 4px));left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#17324d}#overlay,#bookOverlay,#hatchOverlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:#7adfff}#bookOverlay,#hatchOverlay{display:none;background:#0007}.panel{width:min(94vw,430px);max-height:90vh;overflow:auto;background:white;border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:43px;margin:0 0 10px;color:#ff5678}.sub{font-size:17px;line-height:1.35;font-weight:bold;color:#17324d}.animals{font-size:46px;margin:14px 0}.bigbtn,.smallbtn{border:0;border-radius:20px;background:#ffd348;color:#392e00;font-weight:900;box-shadow:0 6px 0 #dba91d}.bigbtn{display:block;width:90%;margin:14px auto 0;padding:17px 10px;font-size:23px}.smallbtn{padding:11px 14px;font-size:16px;margin:6px}#result{font-size:17px;font-weight:bold;color:#17324d;margin-top:14px}.float,.banner{position:absolute;z-index:60;font-weight:900}.float{color:white;font-size:27px;text-shadow:0 2px 5px #0008}.banner{left:50%;top:40%;transform:translate(-50%,-50%);background:#ffffffee;border-radius:25px;padding:16px 22px;font-size:26px;color:#ff5678;text-align:center;box-shadow:0 10px 30px #0003}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.slot{background:#eef7ff;border-radius:18px;padding:10px 4px;min-height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;color:#17324d}.slot .e{font-size:34px}.slot.locked{filter:grayscale(1);opacity:.45}.slot small{font-size:11px;margin-top:4px}#topButtons{position:absolute;z-index:40;right:8px;top:98px;display:flex;gap:6px;flex-direction:column}.round{width:44px;height:44px;border:0;border-radius:50%;background:#ffffffdf;font-size:22px}</style></head><body><div id="game" class="meadow"><div id="bg" class="bg meadowBg"></div><div class="sea"></div><div class="sand"></div><div class="wave"></div><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">32</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">LV <span id="level">1</span></div></div><div id="worldName">🌳 Sunny Meadow</div><div id="combo"></div><div id="topButtons"><button class="round" id="bookBtn">📖</button><button class="round" id="soundBtn">🔊</button></div><div id="field"></div><div id="progressWrap"><div id="progress"></div></div><div id="goal">0 / 15 ⭐</div><div id="overlay"><div class="panel"><h1>Critter Pop! V2.1</h1><div class="sub">Catch critters, find eggs and fill your Critter Book!</div><div class="animals">🐰 🐸 🐢 🐠 🦊</div><button id="play" class="bigbtn">PLAY</button><button id="bookMenu" class="smallbtn">📖 Critter Book</button><div id="result"></div></div></div><div id="bookOverlay"><div class="panel"><h1 style="font-size:34px">Critter Book</h1><div class="sub"><span id="bookCount">0</span> / 12 discovered</div><div id="bookGrid" class="bookgrid"></div><button id="closeBook" class="bigbtn">BACK</button></div></div><div id="hatchOverlay"><div class="panel"><h1 style="font-size:36px">🥚 Egg Time!</h1><div id="hatchText" class="sub">Tap the egg to hatch it!</div><div id="bigEgg" style="font-size:110px;margin:18px">🥚</div><button id="skipHatch" class="smallbtn">Later</button></div></div></div><script>const critters=[{e:'🐰',n:'Bouncy',w:0,m:'hopper'},{e:'🐸',n:'Hoppy',w:0,m:'hopper'},{e:'🐱',n:'Mittens',w:0,m:'stationary'},{e:'🐶',n:'Patches',w:0,m:'hopper'},{e:'🐢',n:'Shelly',w:1,m:'stationary'},{e:'🐙',n:'Squiggles',w:1,m:'swimmer'},{e:'🐠',n:'Bubbles',w:1,m:'swimmer'},{e:'🦀',n:'Snappy',w:1,m:'scuttle'},{e:'🦊',n:'Flick',w:2,m:'hopper'},{e:'🦉',n:'Twinkle',w:2,m:'flutter'},{e:'🦇',n:'Flappy',w:2,m:'flutter'},{e:'🦄',n:'Starshine',w:2,m:'hopper'}];const worlds=[{c:'meadow',name:'🌳 Sunny Meadow',bg:'meadowBg'},{c:'beach',name:'🏖️ Bubble Beach',bg:'beachBg'},{c:'moon',name:'🌙 Moonlight Forest',bg:'moonBg'}],bad=['⛈️','🌩️'];let score=0,timeLeft=32,lives=3,combo=0,level=1,target=15,running=false,spawnTimer,tickTimer,soundOn=true,pendingEgg=false,discovered=new Set(JSON.parse(localStorage.getItem('critterBook')||'[]'));const $=id=>document.getElementById(id),field=$('field'),game=$('game'),bg=$('bg');let audioCtx;function beep(f=650,d=.07){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}function saveBook(){localStorage.setItem('critterBook',JSON.stringify([...discovered]))}function renderBook(){const grid=$('bookGrid');grid.innerHTML='';critters.forEach((c,i)=>{const u=discovered.has(i),d=document.createElement('div');d.className='slot'+(u?'':' locked');d.innerHTML='<div class="e">'+(u?c.e:'❓')+'</div><small>'+(u?c.n:'Unknown')+'</small>';grid.appendChild(d)});$('bookCount').textContent=discovered.size}function update(){$('score').textContent=score;$('time').textContent=timeLeft;$('lives').textContent=lives;$('level').textContent=level;$('progress').style.width=Math.min(100,score/target*100)+'%';$('goal').textContent=score+' / '+target+' ⭐';$('combo').textContent=combo>=3?(combo>=10?'🌈 '+combo+'x CRITTER CRAZY!':combo>=5?'🔥 '+combo+'x SUPER COMBO!':'✨ '+combo+'x COMBO!'):''}function setWorld(){const w=(level-1)%3,W=worlds[w];game.className=W.c;bg.className='bg '+W.bg;$('worldName').textContent=W.name}function clearField(){field.innerHTML=''}function feedback(x,y,t){const f=document.createElement('div');f.className='float';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';field.appendChild(f);let o=1,p=y;const a=setInterval(()=>{o-=.08;p-=4;f.style.opacity=o;f.style.top=p+'px';if(o<=0){clearInterval(a);f.remove()}},35)}function banner(t){const b=document.createElement('div');b.className='banner';b.innerHTML=t;field.appendChild(b);setTimeout(()=>b.remove(),1000)}function discover(i){if(!discovered.has(i)){discovered.add(i);saveBook();banner('🎉 NEW CRITTER!<br>'+critters[i].e+' '+critters[i].n);beep(950,.12)}}function hit(el,type,idx,e){e.preventDefault();if(!running||!el.isConnected)return;const x=el.offsetLeft+18,y=el.offsetTop;if(type==='bad'){lives--;combo=0;feedback(x,y,'-❤️');beep(140,.15)}else if(type==='heart'){lives=Math.min(5,lives+1);feedback(x,y,'+❤️');beep(780)}else if(type==='time'){timeLeft+=5;feedback(x,y,'+5 ⏱️');beep(820)}else if(type==='egg'){pendingEgg=true;banner('YOU FOUND AN EGG! 🥚');beep(980,.12);el.remove();return}else{combo++;let pts=type==='gold'?5:1;score+=pts;feedback(x,y,'+'+pts+' ⭐');beep(type==='gold'?1100:640);if(idx!=null&&Math.random()<.3)discover(idx)}update();el.remove();if(lives<=0)endGame();else if(score>=target)levelComplete()}function spawn(){if(!running)return;const w=(level-1)%3,r=Math.random();let type='good',icon,idx=null,m='stationary';if(r<.08){type='bad';icon=bad[Math.floor(Math.random()*bad.length)]}else if(r<.13){type=Math.random()<.5?'heart':'time';icon=type==='heart'?'❤️':'⏰'}else if(r<.17){type='egg';icon='🥚'}else{const pool=critters.map((c,i)=>c.w===w?i:-1).filter(i=>i>=0);idx=pool[Math.floor(Math.random()*pool.length)];icon=critters[idx].e;m=critters[idx].m;if(r<.23)type='gold'}const d=document.createElement('div');d.className='critter '+m+(type==='gold'?' gold':(['heart','time'].includes(type)?' power':type==='egg'?' egg':''));d.textContent=type==='gold'?'✨'+icon:icon;const maxY=Math.max(170,innerHeight-340);if(m==='swimmer'){d.style.left='0px';d.style.top=(innerHeight*.53+Math.random()*Math.max(20,innerHeight*.17))+'px'}else if(m==='scuttle'){d.style.left='0px';d.style.top=(innerHeight*.80+Math.random()*Math.max(10,innerHeight*.08))+'px'}else if(m==='flutter'){d.style.left='0px';d.style.top=(120+Math.random()*160)+'px'}else{d.style.left=(12+Math.random()*Math.max(12,innerWidth-112))+'px';d.style.top=(115+Math.random()*maxY)+'px'}d.addEventListener('pointerdown',e=>hit(d,type,idx,e));field.appendChild(d);setTimeout(()=>d.remove(),3000)}function beginLevel(){clearInterval(spawnTimer);clearInterval(tickTimer);clearField();score=0;combo=0;timeLeft=32;target=15+(level-1)*4;running=true;setWorld();update();$('overlay').style.display='none';spawn();spawnTimer=setInterval(spawn,1000);tickTimer=setInterval(()=>{timeLeft--;update();if(timeLeft<=0)endGame()},1000)}function startGame(){level=1;lives=3;pendingEgg=false;$('result').innerHTML='';beginLevel()}function levelComplete(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();banner('🎉 LEVEL '+level+' COMPLETE!');setTimeout(()=>{if(pendingEgg){$('hatchOverlay').style.display='flex'}else{level++;beginLevel()}},1050)}function hatch(){const locked=critters.map((c,i)=>discovered.has(i)?-1:i).filter(i=>i>=0);if(locked.length){const i=locked[Math.floor(Math.random()*locked.length)];discovered.add(i);saveBook();$('hatchText').innerHTML='🎉 '+critters[i].e+' <b>'+critters[i].n+'</b> hatched!';$('bigEgg').textContent=critters[i].e;beep(1050,.15)}setTimeout(()=>{$('hatchOverlay').style.display='none';$('bigEgg').textContent='🥚';$('hatchText').textContent='Tap the egg to hatch it!';pendingEgg=false;level++;beginLevel()},1100)}function endGame(){running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();$('overlay').style.display='flex';$('result').innerHTML='🌟 You reached <b>Level '+level+'</b>!';$('play').textContent='PLAY AGAIN'}$('play').onclick=startGame;$('bookBtn').onclick=()=>{renderBook();$('bookOverlay').style.display='flex'};$('bookMenu').onclick=()=>{renderBook();$('bookOverlay').style.display='flex'};$('closeBook').onclick=()=>$('bookOverlay').style.display='none';$('bigEgg').onclick=hatch;$('skipHatch').onclick=()=>{$('hatchOverlay').style.display='none';pendingEgg=false;level++;beginLevel()};$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇'};renderBook();update();</script></body></html>
