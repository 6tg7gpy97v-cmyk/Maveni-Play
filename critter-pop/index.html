<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop!</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#8fe8ff;touch-action:manipulation}#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#8fe8ff 0%,#b8f7ff 62%,#7bdd62 63%,#49b74a 100%)}#hud{position:absolute;z-index:20;top:15px;left:10px;right:10px;display:flex;justify-content:space-between}.pill{background:white;border-radius:18px;padding:9px 12px;font-size:18px;font-weight:bold;color:#17324d;box-shadow:0 4px 10px #0002}#field{position:absolute;inset:0;z-index:10}.critter{position:absolute;width:86px;height:86px;display:flex;align-items:center;justify-content:center;font-size:58px;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 5px 3px #0003)}#overlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:#7adfff}#panel{width:min(92vw,420px);background:white;border-radius:28px;padding:25px 20px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:46px;line-height:1;margin:0 0 12px;color:#ff5678}#subtitle{font-size:19px;line-height:1.35;font-weight:bold;color:#17324d}#animals{font-size:49px;margin:17px 0}#play{display:block;width:90%;margin:15px auto 0;padding:20px 10px;border:0;border-radius:22px;background:#ffd348;color:#392e00;font-size:26px;font-weight:900;box-shadow:0 7px 0 #dba91d;-webkit-appearance:none;appearance:none}#result{font-size:18px;font-weight:bold;color:#17324d;margin-top:17px;line-height:1.4}.float{position:absolute;z-index:40;color:white;font-size:27px;font-weight:bold;text-shadow:0 2px 5px #0008;pointer-events:none}</style></head><body><div id="game"><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">30</span></div><div class="pill">❤️ <span id="lives">3</span></div></div><div id="field"></div><div id="overlay"><div id="panel"><h1>Critter Pop!</h1><div id="subtitle">Tap the happy critters.<br>Don't tap the storm clouds!</div><div id="animals">🐰 🐸 🐱 🦊 🐼</div><button id="play">PLAY</button><div id="result"></div></div></div></div><script>const good=['🐰','🐸','🐱','🦊','🐼','🐵','🐶','🐨','🦁','🐯','🐙','🦄'],bad=['⛈️','🌩️'];let score=0,timeLeft=30,lives=3,running=false,spawnTimer,tickTimer;const field=document.getElementById('field'),overlay=document.getElementById('overlay'),play=document.getElementById('play'),result=document.getElementById('result');function update(){document.getElementById('score').textContent=score;document.getElementById('time').textContent=timeLeft;document.getElementById('lives').textContent=lives}function clearField(){field.innerHTML=''}function feedback(x,y,text){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';field.appendChild(f);let t=y,o=1;const a=setInterval(()=>{t-=4;o-=.07;f.style.top=t+'px';f.style.opacity=o;if(o<=0){clearInterval(a);f.remove()}},35)}function hit(el,isBad,e){e?.preventDefault();if(!running||!el.isConnected)return;if(isBad){lives--;feedback(el.offsetLeft+20,el.offsetTop,'-❤️');navigator.vibrate?.(100)}else{score++;feedback(el.offsetLeft+25,el.offsetTop,'+1 ⭐');navigator.vibrate?.(20)}update();el.remove();if(lives<=0)endGame()}function spawn(){if(!running)return;const isBad=Math.random()<.12,d=document.createElement('div');d.className='critter';d.textContent=isBad?bad[Math.floor(Math.random()*bad.length)]:good[Math.floor(Math.random()*good.length)];d.style.left=(10+Math.random()*Math.max(10,innerWidth-106))+'px';d.style.top=(90+Math.random()*Math.max(80,innerHeight-260))+'px';d.addEventListener('pointerdown',e=>hit(d,isBad,e));field.appendChild(d);setTimeout(()=>d.remove(),1800)}function startGame(){clearInterval(spawnTimer);clearInterval(tickTimer);clearField();score=0;timeLeft=30;lives=3;running=true;update();result.innerHTML='';overlay.style.display='none';spawn();spawnTimer=setInterval(spawn,700);tickTimer=setInterval(()=>{timeLeft--;update();if(timeLeft<=0)endGame()},1000)}function endGame(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();overlay.style.display='flex';const msg=score>=26?'🌟 SUPER STAR!':score>=18?'🎉 Fantastic!':score>=10?'😄 Great job!':'🐣 Nice try!';result.innerHTML=msg+'<br>You caught <b>'+score+'</b> critters!';play.textContent='PLAY AGAIN'}play.addEventListener('click',startGame);play.addEventListener('touchend',e=>{e.preventDefault();startGame()},{passive:false});</script></body></html>
