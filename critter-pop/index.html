<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Critter Pop V2.2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;touch-action:manipulation;background:#8fe8ff}button{font:inherit}#game{position:fixed;inset:0;overflow:hidden}.scene{position:absolute;inset:0;z-index:0;pointer-events:none}.meadowSky,.beachSky,.moonSky{position:absolute;inset:0}.meadowSky{background:linear-gradient(#82ddff 0 62%,#7bdd62 62% 100%)}.beachSky{background:#8ddfff}.moonSky{background:linear-gradient(#101936,#1e2f5d 60%,#14261f 60% 100%)}.sea,.sand,.wave,.moon,.trees,.stars{display:none;position:absolute}.sea{left:0;right:0;top:48%;height:31%;background:linear-gradient(#55cbea,#168fc7)}.sand{left:0;right:0;top:79%;bottom:0;background:linear-gradient(#f6dc8a,#e9bf61)}.wave{left:-10%;right:-10%;top:76%;height:8px;background:#fff9;border-radius:50%;animation:wave 2s ease-in-out infinite alternate}@keyframes wave{to{transform:translateY(5px)}}.moon{width:86px;height:86px;border-radius:50%;right:10%;top:15%;background:#fff9d6;box-shadow:0 0 30px #fff6}.stars{inset:0;background-image:radial-gradient(circle at 15% 18%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 35% 10%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 60% 22%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 80% 12%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 72% 34%,#fff 0 1.5px,transparent 2px)}.trees{left:0;right:0;bottom:18%;height:44%;background:repeating-linear-gradient(100deg,transparent 0 7%,#17341f 7% 11%,transparent 11% 18%)}.trees:before,.trees:after{content:'';position:absolute;bottom:0;border-style:solid;border-width:0 60px 170px 60px;border-color:transparent transparent #1d4b2c transparent}.trees:before{left:5%}.trees:after{right:7%;transform:scale(.85)}#game.beach .sea,#game.beach .sand,#game.beach .wave{display:block}#game.moon .moon,#game.moon .trees,#game.moon .stars{display:block}#hud{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:4px}.pill{background:#fff;border-radius:16px;padding:7px 9px;font-size:15px;font-weight:900;color:#17324d;box-shadow:0 4px 10px #0002}#worldName{position:absolute;z-index:28;top:52px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:900;color:#fff;text-shadow:0 2px 4px #0008;white-space:nowrap}#combo{position:absolute;z-index:35;top:76px;left:50%;transform:translateX(-50%);font-size:23px;font-weight:900;color:#ff5b72;text-shadow:0 2px #fff;min-height:30px;white-space:nowrap}#field{position:absolute;inset:0;z-index:10;overflow:hidden}.critterWrap{position:absolute;width:116px;height:116px;display:flex;align-items:center;justify-content:center;touch-action:none}.critter{width:88px;height:88px;display:flex;align-items:center;justify-content:center;font-size:58px;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 5px 3px #0003)}.stationary{animation:bob .8s ease-in-out infinite alternate}.hopper{animation:hop .72s ease-in-out infinite}.flutterWrap{animation:fly 3.2s ease-in-out forwards}.swimmerWrap{animation:swim 3.4s linear forwards}.scuttleWrap{animation:scuttle 4.2s steps(9,end) forwards}.gold{background:radial-gradient(circle,#fff8a8,#ffd633 55%,#ffad00);border-radius:50%;box-shadow:0 0 22px #ffe100;font-size:52px}.power,.egg{background:#fff;border-radius:50%;box-shadow:0 0 18px #fff}.power{font-size:48px}.egg{font-size:52px}@keyframes bob{from{transform:translateY(-3px) rotate(-2deg)}to{transform:translateY(4px) rotate(2deg)}}@keyframes hop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-38px) scale(1.05)}}@keyframes fly{0%{transform:translateX(-130px) translateY(5px)}25%{transform:translateX(18vw) translateY(-18px)}50%{transform:translateX(48vw) translateY(10px)}75%{transform:translateX(74vw) translateY(-15px)}100%{transform:translateX(calc(100vw + 130px)) translateY(5px)}}@keyframes swim{0%{transform:translateX(-130px) translateY(0)}50%{transform:translateX(50vw) translateY(-14px)}100%{transform:translateX(calc(100vw + 130px)) translateY(0)}}@keyframes scuttle{0%{transform:translateX(-130px)}100%{transform:translateX(calc(100vw + 130px))}}#progressWrap{position:absolute;z-index:30;bottom:max(16px,env(safe-area-inset-bottom));left:14px;right:14px;height:27px;background:#ffffffd9;border:3px solid white;border-radius:18px;overflow:hidden}#progress{height:100%;width:0;background:linear-gradient(90deg,#ffd84c,#ff8a4c)}#goal{position:absolute;z-index:31;bottom:max(20px,calc(env(safe-area-inset-bottom) + 4px));left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#17324d}#overlay,#bookOverlay,#hatchOverlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:#7adfff}#bookOverlay,#hatchOverlay{display:none;background:#0007}.panel{width:min(94vw,430px);max-height:90vh;overflow:auto;background:#fff;border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 14px 40px #0003}h1{font-size:43px;margin:0 0 10px;color:#ff5678}.sub{font-size:17px;line-height:1.35;font-weight:bold;color:#17324d}.animals{font-size:46px;margin:14px 0}.bigbtn,.smallbtn{border:0;border-radius:20px;background:#ffd348;color:#392e00;font-weight:900;box-shadow:0 6px 0 #dba91d}.bigbtn{display:block;width:90%;margin:14px auto 0;padding:17px 10px;font-size:23px}.smallbtn{padding:11px 14px;font-size:16px;margin:6px}#result{font-size:17px;font-weight:bold;color:#17324d;margin-top:14px}.float,.banner{position:absolute;z-index:60;font-weight:900}.float{color:#fff;font-size:27px;text-shadow:0 2px 5px #0008}.banner{left:50%;top:40%;transform:translate(-50%,-50%);background:#ffffffee;border-radius:25px;padding:16px 22px;font-size:26px;color:#ff5678;text-align:center;box-shadow:0 10px 30px #0003}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.slot{background:#eef7ff;border-radius:18px;padding:10px 4px;min-height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;color:#17324d}.slot .e{font-size:34px}.slot.locked{filter:grayscale(1);opacity:.45}.slot small{font-size:11px;margin-top:4px}#topButtons{position:absolute;z-index:40;right:8px;top:98px;display:flex;gap:6px;flex-direction:column}.round{width:44px;height:44px;border:0;border-radius:50%;background:#ffffffdf;font-size:22px}#bigEgg{font-size:110px;margin:18px;cursor:pointer;animation:eggwiggle .7s ease-in-out infinite alternate}@keyframes eggwiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}</style></head><body><div id="game" class="meadow"><div class="scene"><div id="sky" class="meadowSky"></div><div class="sea"></div><div class="sand"></div><div class="wave"></div><div class="stars"></div><div class="moon"></div><div class="trees"></div></div><div id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱️ <span id="time">32</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">LV <span id="level">1</span></div></div><div id="worldName">🌳 Sunny Meadow</div><div id="combo"></div><div id="topButtons"><button class="round" id="bookBtn">📖</button><button class="round" id="soundBtn">🔊</button></div><div id="field"></div><div id="progressWrap"><div id="progress"></div></div><div id="goal">0 / 15 ⭐</div><div id="overlay"><div class="panel"><h1>Critter Pop! V2.2</h1><div class="sub">Catch critters, find eggs and fill your Critter Book!</div><div class="animals">🐰 🐸 🐢 🐠 🦊</div><button id="play" class="bigbtn">PLAY</button><button id="bookMenu" class="smallbtn">📖 Critter Book</button><div id="result"></div></div></div><div id="bookOverlay"><div class="panel"><h1 style="font-size:34px">Critter Book</h1><div class="sub"><span id="bookCount">0</span> / 12 discovered</div><div id="bookGrid" class="bookgrid"></div><button id="closeBook" class="bigbtn">BACK</button></div></div><div id="hatchOverlay"><div class="panel"><h1 style="font-size:36px">🥚 Egg Time!</h1><div id="hatchText" class="sub">Tap the egg to hatch it!</div><div id="bigEgg">🥚</div><button id="skipHatch" class="smallbtn">Later</button></div></div></div><script>const critters=[{e:'🐰',n:'Bouncy',w:0,m:'hopper'},{e:'🐸',n:'Hoppy',w:0,m:'hopper'},{e:'🐱',n:'Mittens',w:0,m:'stationary'},{e:'🐶',n:'Patches',w:0,m:'hopper'},{e:'🐢',n:'Shelly',w:1,m:'stationary'},{e:'🐙',n:'Squiggles',w:1,m:'swimmer'},{e:'🐠',n:'Bubbles',w:1,m:'swimmer'},{e:'🦀',n:'Snappy',w:1,m:'scuttle'},{e:'🦊',n:'Flick',w:2,m:'hopper'},{e:'🦉',n:'Twinkle',w:2,m:'flutter'},{e:'🦇',n:'Flappy',w:2,m:'flutter'},{e:'🦄',n:'Starshine',w:2,m:'hopper'}];const worlds=[{c:'meadow',name:'🌳 Sunny Meadow',sky:'meadowSky'},{c:'beach',name:'🏖️ Bubble Beach',sky:'beachSky'},{c:'moon',name:'🌙 Moonlight Forest',sky:'moonSky'}],bad=['⛈️','🌩️'];let score=0,timeLeft=32,lives=3,combo=0,level=1,target=15,running=false,spawnTimer,tickTimer,soundOn=true,pendingEgg=false,hatchStage=0,discovered=new Set(JSON.parse(localStorage.getItem('critterBook')||'[]'));const $=id=>document.getElementById(id),field=$('field'),game=$('game');let audioCtx;function beep(f=650,d=.07){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}function saveBook(){localStorage.setItem('critterBook',JSON.stringify([...discovered]))}function renderBook(){const grid=$('bookGrid');grid.innerHTML='';critters.forEach((c,i)=>{const u=discovered.has(i),d=document.createElement('div');d.className='slot'+(u?'':' locked');d.innerHTML='<div class="e">'+(u?c.e:'❓')+'</div><small>'+(u?c.n:'Unknown')+'</small>';grid.appendChild(d)});$('bookCount').textContent=discovered.size}function update(){$('score').textContent=score;$('time').textContent=timeLeft;$('lives').textContent=lives;$('level').textContent=level;$('progress').style.width=Math.min(100,score/target*100)+'%';$('goal').textContent=score+' / '+target+' ⭐';$('combo').textContent=combo>=3?(combo>=10?'🌈 '+combo+'x CRITTER CRAZY!':combo>=5?'🔥 '+combo+'x SUPER COMBO!':'✨ '+combo+'x COMBO!'):''}function setWorld(){const w=(level-1)%3,W=worlds[w];game.className=W.c;$('sky').className=W.sky;$('worldName').textContent=W.name}function clearField(){field.innerHTML=''}function feedback(x,y,t){const f=document.createElement('div');f.className='float';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';field.appendChild(f);let o=1,p=y;const a=setInterval(()=>{o-=.08;p-=4;f.style.opacity=o;f.style.top=p+'px';if(o<=0){clearInterval(a);f.remove()}},35)}function banner(t){const b=document.createElement('div');b.className='banner';b.innerHTML=t;field.appendChild(b);setTimeout(()=>b.remove(),1000)}function discover(i){if(!discovered.has(i)){discovered.add(i);saveBook();banner('🎉 NEW CRITTER!<br>'+critters[i].e+' '+critters[i].n);beep(950,.12)}}function tapTarget(wrap,type,idx,e){e.preventDefault();e.stopPropagation();if(!running||!wrap.isConnected)return;const r=wrap.getBoundingClientRect(),x=r.left+20,y=r.top;if(type==='bad'){lives--;combo=0;feedback(x,y,'-❤️');beep(140,.15)}else if(type==='heart'){lives=Math.min(5,lives+1);feedback(x,y,'+❤️');beep(780)}else if(type==='time'){timeLeft+=5;feedback(x,y,'+5 ⏱️');beep(820)}else if(type==='egg'){pendingEgg=true;banner('YOU FOUND AN EGG! 🥚');beep(980,.12);wrap.remove();return}else{combo++;let pts=type==='gold'?5:1;score+=pts;feedback(x,y,'+'+pts+' ⭐');beep(type==='gold'?1100:640);if(idx!=null&&Math.random()<.3)discover(idx)}update();wrap.remove();if(lives<=0)endGame();else if(score>=target)levelComplete()}function spawn(){if(!running)return;const w=(level-1)%3,r=Math.random();let type='good',icon,idx=null,m='stationary';if(r<.08){type='bad';icon=bad[Math.floor(Math.random()*bad.length)]}else if(r<.13){type=Math.random()<.5?'heart':'time';icon=type==='heart'?'❤️':'⏰'}else if(r<.17){type='egg';icon='🥚'}else{const pool=critters.map((c,i)=>c.w===w?i:-1).filter(i=>i>=0);idx=pool[Math.floor(Math.random()*pool.length)];icon=critters[idx].e;m=critters[idx].m;if(r<.23)type='gold'}const wrap=document.createElement('div'),d=document.createElement('div');wrap.className='critterWrap';d.className='critter '+m+(type==='gold'?' gold':(['heart','time'].includes(type)?' power':type==='egg'?' egg':''));d.textContent=type==='gold'?'✨'+icon:icon;wrap.appendChild(d);if(m==='swimmer'){wrap.classList.add('swimmerWrap');wrap.style.left='0';wrap.style.top=(innerHeight*.50+Math.random()*Math.max(25,innerHeight*.16))+'px'}else if(m==='scuttle'){wrap.classList.add('scuttleWrap');wrap.style.left='0';wrap.style.top=(innerHeight*.79+Math.random()*Math.max(10,innerHeight*.07))+'px'}else if(m==='flutter'){wrap.classList.add('flutterWrap');wrap.style.left='0';wrap.style.top=(120+Math.random()*150)+'px'}else{wrap.style.left=(8+Math.random()*Math.max(8,innerWidth-124))+'px';wrap.style.top=(110+Math.random()*Math.max(150,innerHeight-355))+'px'}const handler=e=>tapTarget(wrap,type,idx,e);wrap.addEventListener('pointerdown',handler,{passive:false});wrap.addEventListener('touchstart',handler,{passive:false});field.appendChild(wrap);setTimeout(()=>wrap.remove(),m==='scuttle'?4400:m==='swimmer'?3600:3200)}function beginLevel(){clearInterval(spawnTimer);clearInterval(tickTimer);clearField();score=0;combo=0;timeLeft=32;target=15+(level-1)*4;running=true;setWorld();update();$('overlay').style.display='none';spawn();spawnTimer=setInterval(spawn,1000);tickTimer=setInterval(()=>{timeLeft--;update();if(timeLeft<=0)endGame()},1000)}function startGame(){level=1;lives=3;pendingEgg=false;hatchStage=0;result.innerHTML='';beginLevel()}function showHatch(){hatchStage=0;$('bigEgg').textContent='🥚';$('hatchText').textContent='Tap the egg to hatch it!';$('hatchOverlay').style.display='flex'}function hatchTap(){if(!$('hatchOverlay').style.display||$('hatchOverlay').style.display==='none')return;hatchStage++;if(hatchStage===1){$('bigEgg').textContent='🥚';$('hatchText').textContent='Crack...';beep(700,.08)}else if(hatchStage===2){$('bigEgg').textContent='🐣';$('hatchText').textContent='Crack... crack...';beep(820,.08)}else{const w=(level-1)%3,pool=critters.map((c,i)=>c.w===w?i:-1).filter(i=>i>=0),idx=pool[Math.floor(Math.random()*pool.length)];discovered.add(idx);saveBook();renderBook();$('bigEgg').textContent=critters[idx].e;$('hatchText').innerHTML='🎉 NEW CRITTER!<br><b>'+critters[idx].n+'</b>';beep(1100,.12);setTimeout(()=>{$('hatchOverlay').style.display='none';pendingEgg=false;level++;beginLevel()},1200)}}function levelComplete(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();if(pendingEgg){showHatch()}else{banner('🎉 LEVEL '+level+' COMPLETE!');setTimeout(()=>{level++;beginLevel()},1000)}}function endGame(){if(!running)return;running=false;clearInterval(spawnTimer);clearInterval(tickTimer);clearField();$('overlay').style.display='flex';result.innerHTML='🌟 You reached <b>Level '+level+'</b>!<br>Ready to try again?';play.textContent='PLAY AGAIN'}$('play').addEventListener('click',startGame);$('bookBtn').onclick=$('bookMenu').onclick=()=>{renderBook();$('bookOverlay').style.display='flex'};$('closeBook').onclick=()=>{$('bookOverlay').style.display='none'};$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇'};$('bigEgg').addEventListener('pointerdown',e=>{e.preventDefault();hatchTap()});$('skipHatch').onclick=()=>{$('hatchOverlay').style.display='none';pendingEgg=false;level++;beginLevel()};renderBook();update();</script></body></html>
