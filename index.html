<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MAVENI — Debug Build</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173943;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hide{display:none!important}.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#102f38}.card,.panel{width:min(700px,94vw);padding:28px;border-radius:28px;background:#fff8e8;color:#29434c;text-align:center;box-shadow:0 20px 70px #0008}.logo{font-size:clamp(48px,13vw,80px);font-weight:950;letter-spacing:8px;color:#486b76}.tag{letter-spacing:4px;font-size:12px}.start,.choice{border:0;border-radius:18px;padding:16px 24px;background:#6f9f89;color:#fff;font-weight:900;font-size:18px}.hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.pill,.quest,.toast{background:#fff8e8e8;color:#29434c;border-radius:16px;padding:9px 13px;box-shadow:0 4px 15px #0003;font-weight:800}.quest{position:fixed;right:12px;top:58px;width:min(350px,calc(100vw - 24px));z-index:5}.quest small{display:block;opacity:.7}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;width:min(700px,calc(100vw - 28px));text-align:center}.controls{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}.pad{position:absolute;left:15px;bottom:16px;width:156px;height:156px;pointer-events:auto}.b{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff8e8e8;color:#29434c;font-size:22px;font-weight:900;box-shadow:0 3px 12px #0004;touch-action:none}.u{left:51px}.l{left:0;top:51px}.r{right:0;top:51px}.d{left:51px;bottom:0}.ex{right:18px;bottom:26px;width:84px;height:84px;background:#6f9f89;color:#fff;pointer-events:auto;font-size:13px}.sound{position:fixed;right:15px;bottom:16px;width:44px;height:44px;border:0;border-radius:50%;z-index:9}.modal{position:fixed;inset:0;z-index:15;display:none;place-items:center;padding:20px;background:#173943dd}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.choice{background:#8eb59f}.panel h2{font-size:34px}@media(max-width:800px){.controls{display:block}.quest{top:70px}.pill{font-size:12px}}</style></head><body><canvas id="g"></canvas><div id="intro" class="intro"><div class="card"><div class="logo">MAVENI</div><div class="tag">WHERE WONDER GROWS</div><p>A living little world where curiosity changes what happens.</p><button id="start" class="start">ENTER THE VALLEY</button><p style="font-size:12px;opacity:.7">Phone: touch controls • Computer: WASD/arrows + E</p></div></div><div id="hud" class="hud hide"><div class="pill">✦ Sparks <span id="sp">0</span></div><div class="pill">⭐ Level <span id="lv">1</span></div></div><div id="quest" class="quest hide"><b id="qt"></b><small id="qx"></small></div><div id="toast" class="toast hide"></div><div id="controls" class="controls hide"><div class="pad"><button class="b u" data-k="u">▲</button><button class="b l" data-k="l">◀</button><button class="b r" data-k="r">▶</button><button class="b d" data-k="d">▼</button></div><button id="ex" class="b ex">EXPLORE</button></div><button id="sound" class="sound hide">♪</button><div id="modal" class="modal"><div id="panel" class="panel"></div></div><script>'use strict';const c=document.getElementById('g'),x=c.getContext('2d'),W=1280,H=720,K={};let on=0,q=0,s=0,lvl=1,msg=0,last=0;const p={x:180,y:560},m={x:315,y:505},o={spark:{x:850,y:270},num:{x:1030,y:520},story:{x:450,y:150},work:{x:650,y:590},gate:{x:1160,y:300}};const Q=[['First Steps','Meet your companion.'],['A Little Glow','Find the Spark.'],['Number Garden','Count five fireflies.'],['Story Grove','Choose the missing letter.'],['Spark Workshop','Take your Spark to the workshop.'],['The Valley Opens','Walk to the Whispering Path.'],['Valley Explorer','Explore the valley.']];function size(){let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function say(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');msg=240}function ui(){document.getElementById('sp').textContent=s;document.getElementById('lv').textContent=lvl;document.getElementById('qt').textContent=Q[q][0];document.getElementById('qx').textContent=Q[q][1]}function start(){if(on)return;on=1;document.getElementById('intro').classList.add('hide');['hud','quest','controls','sound'].forEach(id=>document.getElementById(id).classList.remove('hide'));ui();say('Walk to the blue companion, then press EXPLORE.')}document.getElementById('start').onclick=start;addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key===' '||e.key.toLowerCase()==='e')act()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=1};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();K[k]=0}))});document.getElementById('ex').onpointerdown=e=>{e.preventDefault();act()};function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function act(){if(!on||document.getElementById('modal').style.display==='grid')return;if(q===0&&D(p,m)<105){q=1;say('Hello! Find the glowing Spark near the stream.')}else if(q===1&&D(p,o.spark)<120){s++;q=2;say('Spark found! Visit Number Garden.')}else if(q===2&&D(p,o.num)<155)math();else if(q===3&&D(p,o.story)<155)letters();else if(q===4&&D(p,o.work)<155){q=5;say('The workshop woke up. A new path is open!')}else if(q===5&&D(p,o.gate)<155){q=6;lvl=2;say('You found the Whispering Path. Explore the valley!')}else say('Follow the quest marker.');ui()}function open(h){document.getElementById('panel').innerHTML=h;document.getElementById('modal').style.display='grid'}function closeM(){document.getElementById('modal').style.display='none'}function math(){open('<h2>Number Garden</h2><p>How many fireflies?</p><div style="font-size:42px">✨ ✨ ✨ ✨ ✨</div><div class="choices"><button class="choice" data-a="3">3</button><button class="choice" data-a="5">5</button><button class="choice" data-a="7">7</button></div><p><button class="choice" id="back">BACK</button></p>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.id==='back')return closeM();if(b.dataset.a==='5'){q=3;closeM();say('Correct! Find Story Grove.');ui()}else say('Count them again.')})}function letters(){open('<h2>Story Grove</h2><p>Which letter comes after A in <b>MAVENI</b>?</p><div class="choices"><button class="choice" data-a="M">M</button><button class="choice" data-a="V">V</button><button class="choice" data-a="E">E</button><button class="choice" data-a="Z">Z</button></div><p><button class="choice" id="back">BACK</button></p>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.id==='back')return closeM();if(b.dataset.a==='V'){q=4;closeM();say('Correct! Take your Spark to the Workshop.');ui()}else say('Read the word left to right.')})}function move(dt){let X=0,Y=0;if(K.w||K.arrowup||K.u)Y--;if(K.s||K.arrowdown||K.d)Y++;if(K.a||K.arrowleft||K.l)X--;if(K.d||K.arrowright||K.r)X++;if(X||Y){let n=Math.hypot(X,Y);p.x=Math.max(30,Math.min(W-30,p.x+X/n*220*dt));p.y=Math.max(80,Math.min(H-30,p.y+Y/n*220*dt))}}function circ(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}function marker(a,b,i,t,on){x.fillStyle=on?'#fff2b8':'#fff8e8dd';x.beginPath();x.roundRect(a-70,b-30,140,60,15);x.fill();x.fillStyle='#486b76';x.textAlign='center';x.font='bold 18px system-ui';x.fillText(i,a,b+3);x.font='12px system-ui';x.fillText(t,a,b+22);x.textAlign='left'}function world(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9ed9ed');g.addColorStop(.45,'#d5efd5');g.addColorStop(1,'#80b47b');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#60b6d8';x.beginPath();x.moveTo(650,0);x.bezierCurveTo(570,170,760,270,650,410);x.bezierCurveTo(570,540,740,620,650,720);x.lineTo(800,720);x.bezierCurveTo(870,600,700,520,800,400);x.bezierCurveTo(880,260,700,170,800,0);x.fill();x.fillStyle='#d6b98b';x.beginPath();x.moveTo(80,720);x.quadraticCurveTo(300,560,470,480);x.quadraticCurveTo(670,380,910,430);x.lineTo(910,515);x.quadraticCurveTo(650,470,500,550);x.quadraticCurveTo(300,650,230,720);x.fill();[[100,150],[1040,140],[1140,480],[760,620],[520,120],[90,430],[1110,620],[350,300],[900,250]].forEach(t=>{x.fillStyle='#795743';x.fillRect(t[0]-8,t[1],16,60);circ(t[0]-25,t[1]-8,32,'#5c9869');circ(t[0]+22,t[1]-12,36,'#5c9869');circ(t[0],t[1]-40,38,'#5c9869')});marker(o.num.x,o.num.y,'✿','Number Garden',q===2);marker(o.story.x,o.story.y,'📖','Story Grove',q===3);marker(o.work.x,o.work.y,'✦','Spark Workshop',q===4);if(q>=5)marker(o.gate.x,o.gate.y,'➜','Whispering Path',1);if(q===1){circ(o.spark.x,o.spark.y,18,'#ffe36d');circ(o.spark.x,o.spark.y,8,'#fff8b0')}x.fillStyle='#8a684c';x.fillRect(605,555,100,58);x.fillStyle='#d49a67';x.beginPath();x.moveTo(590,555);x.lineTo(655,505);x.lineTo(720,555);x.fill();circ(m.x,m.y+10,23,'#5d9fc0');circ(m.x-8,m.y+4,3,'#173943');circ(m.x+8,m.y+4,3,'#173943');circ(p.x,p.y,20,'#4b7480');x.fillStyle='#fff';x.font='bold 12px system-ui';x.textAlign='center';x.fillText('YOU',p.x,p.y-28);x.textAlign='left'}function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;if(on){move(dt);if(msg>0){msg--;if(!msg)document.getElementById('toast').classList.add('hide')}}x.clearRect(0,0,W,H);world();requestAnimationFrame(loop)}ui();requestAnimationFrame(loop);</script></body></html>
