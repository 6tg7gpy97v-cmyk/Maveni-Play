<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MAVENI — First Discovery</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10232b;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.intro{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#16343dcc,#10232bee);z-index:5;padding:22px}.card{width:min(560px,92vw);padding:30px;border-radius:28px;background:#fff8e8;text-align:center;box-shadow:0 20px 80px #0008}.logo{font-size:clamp(42px,12vw,64px);letter-spacing:8px;color:#486b76;font-weight:800}.tag{letter-spacing:4px;color:#6b8d8b;font-size:12px}.card p{color:#44545a;line-height:1.5}.start{border:0;border-radius:999px;padding:17px 30px;background:#6f9f89;color:#fff;font-weight:800;font-size:18px;touch-action:manipulation}.controls{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}.pad{position:absolute;left:16px;bottom:18px;width:154px;height:154px;pointer-events:auto}.b{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff8e8d9;color:#35505b;font-size:23px;font-weight:800;box-shadow:0 3px 12px #0004;touch-action:none}.u{left:50px}.l{left:0;top:50px}.r{right:0;top:50px}.d{left:50px;bottom:0}.do{right:20px;bottom:30px;width:76px;height:76px;background:#6f9f89;color:white;pointer-events:auto}.activity{position:fixed;inset:0;z-index:4;display:none;place-items:center;background:#16343dcc}.panel{width:min(820px,90vw);background:#fff8e8;border-radius:28px;padding:28px;text-align:center}.choices{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.choice{border:0;border-radius:20px;padding:18px 30px;background:#8eb59f;color:#fff;font-size:26px;font-weight:800}.close{margin-top:20px;border:0;border-radius:999px;padding:10px 22px;background:#ddd;color:#435}
@media(max-width:800px){.controls{display:block}}
</style></head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div class="intro" id="intro"><div class="card"><div class="logo">MAVENI</div><div class="tag">WHERE WONDER GROWS</div><p>Meet your first companion, discover a Spark and try a gentle learning challenge.</p><button class="start" id="start">Begin the First Discovery</button><p style="font-size:12px">Designed for mobile. Turn your phone sideways for the best view.</p></div></div>
<div class="controls" id="controls"><div class="pad"><button class="b u" data-k="up">▲</button><button class="b l" data-k="left">◀</button><button class="b r" data-k="right">▶</button><button class="b d" data-k="down">▼</button></div><button class="b do" id="do">EXPLORE</button></div>
<div class="activity" id="activity"><div class="panel" id="panel"></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),keys={};let playing=false,q=0,spark=false,activity='';let p={x:180,y:560},pet={x:315,y:500,t:0};
const flowers=Array.from({length:80},()=>({x:20+Math.random()*1240,y:100+Math.random()*590,c:['#e7aec0','#f3d26b','#9dbbe6'][Math.floor(Math.random()*3)]}));
const trees=[[100,150,1.2],[1030,140,1.3],[1140,480,1.1],[760,610,1.2],[520,120,1],[90,430,.9],[1110,620,.9]];
function start(){playing=true;document.getElementById('intro').style.display='none';say('A little Spark is waiting nearby…')}document.getElementById('start').addEventListener('click',start);document.getElementById('start').addEventListener('touchend',e=>{e.preventDefault();start()},{passive:false});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;let dn=e=>{e.preventDefault();keys[k]=1},up=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});document.getElementById('do').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
let message='',timer=0;function say(t){message=t;timer=220}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function interact(){if(!playing)return;if(q===1&&dist(p,{x:870,y:270})<90){spark=true;q=2;say('You found a Spark! Visit the Number Garden.')}else if(q===2&&dist(p,{x:1020,y:520})<130){openMath()}else if(q===3&&dist(p,{x:450,y:150})<130){openLetters()}else if(q===4&&dist(p,{x:650,y:590})<130){say('Guide the Spark with your finger in the next build!');q=5}}
function openMath(){activity='math';document.getElementById('activity').style.display='grid';document.getElementById('panel').innerHTML='<h2>Number Garden</h2><p>How many glowing fireflies are there?</p><div style="font-size:40px">✨ ✨ ✨ ✨ ✨</div><div class="choices"><button class="choice" data-a="3">3</button><button class="choice" data-a="5">5</button><button class="choice" data-a="7">7</button></div><button class="close" onclick="closeActivity()">Not now</button>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='5'){q=3;closeActivity();say('Great counting! Now visit the Story Grove.')}else say('Count them again.');})}
function openLetters(){activity='letters';document.getElementById('activity').style.display='grid';document.getElementById('panel').innerHTML='<h2>Story Grove</h2><p>Which letter comes after A in MAVENI?</p><h1>M &nbsp; A &nbsp; V &nbsp; E &nbsp; N &nbsp; I</h1><div class="choices"><button class="choice" data-a="M">M</button><button class="choice" data-a="V">V</button><button class="choice" data-a="E">E</button><button class="choice" data-a="Z">Z</button></div><button class="close" onclick="closeActivity()">Not now</button>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='V'){q=4;closeActivity();say('You found V! Visit the Spark Workshop.')}else say('Look at the word again.');})}function closeActivity(){document.getElementById('activity').style.display='none'}
function tree(t){ctx.save();ctx.translate(t[0],t[1]);ctx.scale(t[2],t[2]);ctx.fillStyle='#795743';ctx.fillRect(-10,0,20,65);ctx.fillStyle='#5c9869';for(let z of [[-28,-4,34],[20,-10,38],[0,-38,39]]){ctx.beginPath();ctx.arc(z[0],z[1],z[2],0,7);ctx.fill()}ctx.restore()}
function marker(x,y,icon,label){ctx.fillStyle='#fff8e8dd';ctx.beginPath();ctx.roundRect(x-62,y-32,124,64,16);ctx.fill();ctx.fillStyle='#486b76';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(icon,x,y+5);ctx.font='12px system-ui';ctx.fillText(label,x,y+23);ctx.textAlign='left'}
function drawWorld(){let g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#a8dcf0');g.addColorStop(.45,'#d4efd4');g.addColorStop(1,'#80b47b');ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);ctx.fillStyle='#62b9dd';ctx.beginPath();ctx.moveTo(650,0);ctx.bezierCurveTo(580,180,760,270,650,410);ctx.bezierCurveTo(570,540,730,620,650,720);ctx.lineTo(790,720);ctx.bezierCurveTo(850,610,690,520,790,400);ctx.bezierCurveTo(870,260,700,170,790,0);ctx.fill();ctx.fillStyle='#d5b78b';ctx.beginPath();ctx.moveTo(120,720);ctx.quadraticCurveTo(300,570,470,480);ctx.quadraticCurveTo(650,380,900,430);ctx.lineTo(900,510);ctx.quadraticCurveTo(650,470,500,550);ctx.quadraticCurveTo(330,650,260,720);ctx.fill();flowers.forEach(f=>{ctx.strokeStyle='#5b9361';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y-9);ctx.stroke();ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y-11,4,0,7);ctx.fill()});trees.forEach(tree);marker(1020,520,'1 2 3','Number Garden');marker(450,150,'ABC','Story Grove');marker(650,590,'✦','Spark Workshop');if(!spark){ctx.shadowColor='#ffe47b';ctx.shadowBlur=30;ctx.fillStyle='#ffe47b';ctx.beginPath();ctx.arc(870,270,14,0,7);ctx.fill();ctx.shadowBlur=0}}
function drawPet(){let b=Math.sin(pet.t*2)*4;ctx.save();ctx.translate(pet.x,pet.y+b);ctx.fillStyle='#b8d7cf';ctx.beginPath();ctx.ellipse(0,10,27,31,0,0,7);ctx.fill();ctx.fillStyle='#d9e7d7';ctx.beginPath();ctx.arc(0,-17,27,0,7);ctx.fill();ctx.fillStyle='#9fc7be';ctx.beginPath();ctx.moveTo(-23,-34);ctx.lineTo(-38,-62);ctx.lineTo(-7,-43);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(23,-34);ctx.lineTo(38,-62);ctx.lineTo(7,-43);ctx.closePath();ctx.fill();ctx.fillStyle='#263b55';ctx.beginPath();ctx.arc(-9,-19,4,0,7);ctx.arc(9,-19,4,0,7);ctx.fill();ctx.fillStyle='#ffe27a';ctx.shadowColor='#ffe27a';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,5,7,0,7);ctx.fill();ctx.shadowBlur=0;ctx.restore()}
function draw(){if(playing){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*4;p.y+=dy/l*4}p.x=Math.max(30,Math.min(1250,p.x));p.y=Math.max(90,Math.min(680,p.y));pet.t+=.04;pet.x+=(p.x+Math.cos(pet.t)*45-pet.x)*.025;pet.y+=(p.y+Math.sin(pet.t*1.3)*35+18-pet.y)*.025;if(q===0&&dist(p,pet)<80){q=1;say('Hi! I am your first companion. Let’s explore together.')}}drawWorld();drawPet();ctx.fillStyle='#526f9b';ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.fill();ctx.fillStyle='#fff8e8dd';ctx.beginPath();ctx.roundRect(24,22,310,100,18);ctx.fill();ctx.fillStyle='#24323b';ctx.font='bold 30px system-ui';ctx.fillText('MAVENI',42,57);ctx.font='12px system-ui';ctx.fillText('WHERE WONDER GROWS',44,78);ctx.font='15px system-ui';ctx.fillText(q<2?'FIRST DISCOVERY':'DISCOVERY PATH',44,103);if(message&&timer){ctx.fillStyle='#fff8e8';ctx.beginPath();ctx.roundRect(690,560,550,92,20);ctx.fill();ctx.fillStyle='#24323b';ctx.font='20px system-ui';ctx.fillText(message,715,615);timer--}requestAnimationFrame(draw)}draw();
</script></body></html>
