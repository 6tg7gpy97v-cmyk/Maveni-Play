<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAVENI — 3D First Valley</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#8fd0e2;font-family:system-ui}#game{width:100%;height:100%;display:block}#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#244d58aa,#102d36dd);z-index:5}.card{background:#fff8e8ee;padding:32px;border-radius:30px;text-align:center;width:min(520px,86vw)}h1{font-size:64px;letter-spacing:10px;margin:0;color:#4d7580}button{border:0;border-radius:999px;padding:16px 28px;background:#6e9f88;color:white;font-weight:800;font-size:18px}#hint{position:fixed;left:15px;bottom:15px;color:#29434c;background:#fff8e8cc;padding:10px 14px;border-radius:16px;z-index:4}.hud{position:fixed;top:14px;left:14px;z-index:4;background:#fff8e8dd;padding:10px 14px;border-radius:16px;color:#29434c;font-weight:800}</style></head><body><canvas id="game"></canvas><div id="start"><div class="card"><h1>MAVENI</h1><p>First Valley — 3D prototype</p><p>Explore a gentle magical world and meet your companion.</p><button id="go">ENTER THE VALLEY</button></div></div><div class="hud" id="hud">✦ Sparks <span id="spark">0</span></div><div id="hint">Drag to look • touch/hold to move</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd8e8);scene.fog=new THREE.Fog(0x9bd8e8,35,120);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);camera.position.set(0,7,12);const hemi=new THREE.HemisphereLight(0xdff7ff,0x52765c,2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff1c9,3);sun.position.set(-20,35,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160,32,32),new THREE.MeshStandardMaterial({color:0x83b878,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const path=new THREE.Mesh(new THREE.PlaneGeometry(70,8),new THREE.MeshStandardMaterial({color:0xd6b98d,roughness:1}));path.rotation.x=-Math.PI/2;path.position.set(0,.02,4);path.rotation.z=.12;scene.add(path);const river=new THREE.Mesh(new THREE.PlaneGeometry(12,150),new THREE.MeshStandardMaterial({color:0x55b9d8,transparent:true,opacity:.9,roughness:.15,metalness:.05}));river.rotation.x=-Math.PI/2;river.position.set(14,.04,0);scene.add(river);function tree(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.48*s,3*s,8),new THREE.MeshStandardMaterial({color:0x73513e}));trunk.position.y=1.5*s;trunk.castShadow=true;g.add(trunk);for(const [y,r] of [[3.2,2],[4.4,1.7],[5.3,1.25]]){const c=new THREE.Mesh(new THREE.SphereGeometry(r*s,12,10),new THREE.MeshStandardMaterial({color:0x4f9065,roughness:.95}));c.position.y=y*s;c.castShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g)}[[ -18,-18,1.5],[-8,-25,1.2],[8,-20,1.4],[28,-18,1.6],[-25,4,1.3],[-14,17,1.6],[3,25,1.2],[24,16,1.4],[34,2,1.2],[-34,-2,1.4]].forEach(t=>tree(...t));function bush(x,z,s=1){const m=new THREE.Mesh(new THREE.SphereGeometry(1.2*s,12,8),new THREE.MeshStandardMaterial({color:0x6da96f}));m.position.set(x,1*s,z);m.castShadow=true;scene.add(m)}for(let i=0;i<35;i++)bush((Math.random()-.5)*70,(Math.random()-.5)*60,.4+Math.random()*.7);function creature(color=0x72b9c8){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,18),new THREE.MeshStandardMaterial({color,roughness:.75}));body.scale.set(1,.9,1.15);body.castShadow=true;g.add(body);const belly=new THREE.Mesh(new THREE.SphereGeometry(.65,20,14),new THREE.MeshStandardMaterial({color:0xc9ead8,roughness:.8}));belly.scale.z=.65;belly.position.set(0,-.05,1);g.add(belly);for(const x of [-.48,.48]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),new THREE.MeshStandardMaterial({color:0x17343d,roughness:.3}));eye.position.set(x,.35,1.02);g.add(eye)}const earMat=new THREE.MeshStandardMaterial({color:0x5b9eae});for(const x of [-.7,.7]){const e=new THREE.Mesh(new THREE.SphereGeometry(.38,16,10),earMat);e.scale.set(.65,1.25,.45);e.position.set(x,.9,.15);g.add(e)}return g}const player=creature(0x89c6d2);player.position.set(-8,1.15,10);scene.add(player);const companion=creature(0x75b9c7);companion.scale.setScalar(.8);companion.position.set(-3,.9,6);scene.add(companion);const sparkGroup=new THREE.Group();const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshStandardMaterial({color:0xffe56b,emissive:0xffc928,emissiveIntensity:2,roughness:.2}));gem.castShadow=true;sparkGroup.add(gem);for(let i=0;i<10;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:0xfff4a3}));p.position.set((Math.random()-.5)*2,Math.random()*2,(Math.random()-.5)*2);sparkGroup.add(p)}sparkGroup.position.set(8,2,0);scene.add(sparkGroup);const marker=new THREE.Mesh(new THREE.CylinderGeometry(1.2,.9,.35,24),new THREE.MeshStandardMaterial({color:0x8db7a1}));marker.position.set(-3,.18,-7);scene.add(marker);let started=false,sparks=0,moving=false,keys={};document.querySelector('#go').onclick=()=>{started=true;document.querySelector('#start').style.display='none'};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let touchX=0,touchY=0;canvas.addEventListener('pointerdown',e=>{moving=true;touchX=e.clientX;touchY=e.clientY});canvas.addEventListener('pointerup',()=>moving=false);canvas.addEventListener('pointermove',e=>{if(moving){const dx=e.clientX-touchX,dy=e.clientY-touchY;player.rotation.y-=dx*.004;touchX=e.clientX;touchY=e.clientY}});function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);function animate(t){requestAnimationFrame(animate);const dt=Math.min(.04,(t-(window._t||t))/1000);window._t=t;if(started){let x=0,z=0;if(keys.w||keys.arrowup)z-=1;if(keys.s||keys.arrowdown)z+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;player.position.x+=x*dt*7;player.position.z+=z*dt*7;player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);if(companion.position.distanceTo(player.position)>4){companion.position.lerp(new THREE.Vector3(player.position.x,companion.position.y,player.position.z+2),dt*1.5)}camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+7,player.position.z+12),dt*3);camera.lookAt(player.position.x,player.position.y+1,player.position.z-2);if(player.position.distanceTo(sparkGroup.position)<2&&sparks===0){sparks=1;document.querySelector('#spark').textContent='1';gem.material.emissiveIntensity=.2;}}gem.rotation.y+=dt*2;gem.rotation.x+=dt;companion.rotation.y=Math.sin(t*.001)*.15}renderer.render(scene,camera)}animate(0)</script></body></html>
