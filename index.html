<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#173943">
<title>MAVENI — First Valley</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173943;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hidden{display:none!important}
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 35%,#4e8f91aa,#102a34ee 65%)}.card{width:min(620px,92vw);padding:34px;border:1px solid #ffffff55;border-radius:32px;background:#fff8e8f5;text-align:center;box-shadow:0 25px 100px #0008}.logo{font-size:clamp(48px,13vw,78px);letter-spacing:9px;font-weight:900;color:#486b76}.tag{letter-spacing:5px;font-size:12px;color:#6b8d8b}.card p{color:#40535a;line-height:1.5}.start{border:0;border-radius:999px;padding:17px 32px;background:#6f9f89;color:white;font-weight:850;font-size:18px;box-shadow:0 8px 20px #416f5a55;touch-action:manipulation}.hint{font-size:12px!important;opacity:.75}
.hud{position:fixed;z-index:5;left:16px;top:16px;display:flex;gap:10px;align-items:center;pointer-events:none}.pill{padding:9px 13px;border-radius:999px;background:#fff8e8dd;color:#29434c;font-weight:800;box-shadow:0 4px 14px #0002}.sparkCount{display:flex;align-items:center;gap:6px}.quest{position:fixed;z-index:5;right:16px;top:16px;width:min(340px,calc(100vw - 32px));padding:12px 15px;border-radius:18px;background:#fff8e8dd;color:#29434c;box-shadow:0 4px 14px #0002;pointer-events:none}.quest b{display:block;margin-bottom:3px}.quest small{opacity:.72}.toast{position:fixed;z-index:8;left:50%;bottom:24px;transform:translateX(-50%);width:min(700px,calc(100vw - 34px));padding:14px 18px;border-radius:20px;background:#fff8e8f2;color:#24343a;text-align:center;font-weight:700;box-shadow:0 10px 35px #0005;pointer-events:none}.controls{display:none;position:fixed;inset:0;z-index:7;pointer-events:none}.pad{position:absolute;left:15px;bottom:18px;width:156px;height:156px;pointer-events:auto}.b{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff8e8df;color:#35505b;font-size:23px;font-weight:850;box-shadow:0 3px 12px #0004;touch-action:none;-webkit-tap-highlight-color:transparent}.u{left:51px}.l{left:0;top:51px}.r{right:0;top:51px}.d{left:51px;bottom:0}.do{right:20px;bottom:28px;width:82px;height:82px;background:#6f9f89;color:white;pointer-events:auto;font-size:14px}.sound{position:fixed;z-index:9;right:16px;bottom:16px;width:44px;height:44px;border:0;border-radius:50%;background:#fff8e8dd;color:#35505b;font-size:20px}
.activity{position:fixed;inset:0;z-index:15;display:none;place-items:center;padding:20px;background:#173943dd}.panel{width:min(820px,94vw);max-height:90vh;overflow:auto;background:#fff8e8;border-radius:30px;padding:28px;text-align:center;box-shadow:0 20px 80px #0008}.panel h2{margin:0 0 8px;color:#486b76;font-size:34px}.panel p{color:#40535a}.choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0}.choice{min-width:76px;border:0;border-radius:20px;padding:17px 24px;background:#8eb59f;color:#fff;font-size:25px;font-weight:900;touch-action:manipulation}.choice:active{transform:scale(.96)}.close{border:0;border-radius:999px;padding:10px 22px;background:#ddd;color:#435;font-weight:700}.win{font-size:54px;margin:8px}.mapLegend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#5d6f72}
@media(max-width:800px){.controls{display:block}.quest{top:70px;right:10px}.hud{top:10px;left:10px}.pill{font-size:13px;padding:8px 11px}.toast{bottom:20px}.sound{bottom:18px;right:18px}.panel{padding:22px}}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div class="intro" id="intro"><div class="card"><div class="logo">MAVENI</div><div class="tag">WHERE WONDER GROWS</div><p>A gentle little world where curiosity changes what happens around you.</p><button class="start" id="start">Begin the First Discovery</button><p class="hint">Explore • meet your companion • find Sparks • learn through play<br>Best in landscape on a phone.</p></div></div>
<div class="hud hidden" id="hud"><div class="pill">MAVENI</div><div class="pill sparkCount">✦ <span id="sparkText">0 / 3</span></div></div>
<div class="quest hidden" id="quest"><b id="questTitle">First Discovery</b><small id="questText">Find your companion.</small></div>
<div class="toast hidden" id="toast"></div>
<div class="controls hidden" id="controls"><div class="pad"><button class="b u" data-k="up">▲</button><button class="b l" data-k="left">◀</button><button class="b r" data-k="right">▶</button><button class="b d" data-k="down">▼</button></div><button class="b do" id="do">EXPLORE</button></div>
<button class="sound hidden" id="sound" aria-label="Sound">♪</button>
<div class="activity" id="activity"><div class="panel" id="panel"></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=1280,H=720,keys={},TAU=Math.PI*2;
let playing=false,started=false,quest=0,sparks=0,toastTimer=0,audioOn=true,audioCtx=null,last=0,shake=0;
const player={x:180,y:560,face:1};
const companion={x:310,y:500,t:0,friend:0};
const particles=[];
const flowers=Array.from({length:125},()=>({x:20+Math.random()*1240,y:90+Math.random()*610,c:['#e7aec0','#f3d26b','#9dbbe6','#f4c7a1'][Math.floor(Math.random()*4)],s:.7+Math.random()*.7}));
const trees=[[100,150,1.2],[1030,140,1.3],[1140,480,1.1],[760,610,1.2],[520,120,1],[90,430,.9],[1110,620,.9],[350,300,.85],[900,250,.8]];
const points={spark:{x:850,y:270},number:{x:1020,y:520},story:{x:450,y:150},workshop:{x:650,y:590}};
const questText=[
 ['First Discovery','Walk to your companion.'],
 ['A Little Spark','Your companion has noticed something glowing. Find the Spark.'],
 ['Number Garden','Visit the Number Garden and count the fireflies.'],
 ['Story Grove','Visit Story Grove and find the missing letter.'],
 ['Spark Workshop','Bring your Spark to the Workshop.'],
 ['A New Friend','You completed the first discovery. Explore the valley.']
];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();
function start(){if(started)return;started=true;playing=true;document.getElementById('intro').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('quest').classList.remove('hidden');document.getElementById('controls').classList.remove('hidden');document.getElementById('sound').classList.remove('hidden');updateQuest();say('Something small is waiting nearby. Walk over and say hello.');beep(660,.08)}
const sb=document.getElementById('start');sb.addEventListener('click',start);sb.addEventListener('touchend',e=>{e.preventDefault();start()},{passive:false});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e'||e.key===' ')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const dn=e=>{e.preventDefault();keys[k]=1},up=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});document.getElementById('do').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function beep(freq=440,dur=.1){if(!audioOn)return;try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}catch(e){}}
document.getElementById('sound').onclick=()=>{audioOn=!audioOn;document.getElementById('sound').textContent=audioOn?'♪':'×';if(audioOn)beep(520,.08)};
function say(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');toastTimer=240}
function updateQuest(){document.getElementById('questTitle').textContent=questText[quest][0];document.getElementById('questText').textContent=questText[quest][1];document.getElementById('sparkText').textContent=sparks+' / 3'}
function addSpark(x,y){sparks++;for(let i=0;i<20;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3-1,life:50,r:2+Math.random()*4});beep(740,.13);setTimeout(()=>beep(980,.1),70);updateQuest()}
function interact(){if(!playing)return;if(quest===0&&dist(player,companion)<100){quest=1;companion.friend=1;say('Hello! I am your companion. I heard a tiny sparkle.');beep(620,.1);setTimeout(()=>beep(760,.1),100)}else if(quest===1&&dist(player,points.spark)<105){addSpark(points.spark.x,points.spark.y);quest=2;say('You found your first Spark! Let’s learn something together.')}else if(quest===2&&dist(player,points.number)<145)openMath();else if(quest===3&&dist(player,points.story)<145)openLetters();else if(quest===4&&dist(player,points.workshop)<145){quest=5;say('The Spark is happy. You made something new happen!');for(let i=0;i<30;i++)particles.push({x:points.workshop.x,y:points.workshop.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:80,r:3+Math.random()*4});beep(880,.12);setTimeout(()=>beep(1100,.14),90)}updateQuest()}
function openMath(){document.getElementById('activity').style.display='grid';document.getElementById('panel').innerHTML='<div class="win">✦</div><h2>Number Garden</h2><p>Five little fireflies are glowing. How many can you count?</p><div style="font-size:42px;letter-spacing:8px">✨ ✨ ✨ ✨ ✨</div><div class="choices"><button class="choice" data-a="3">3</button><button class="choice" data-a="5">5</button><button class="choice" data-a="7">7</button></div><button class="close" id="close">Not now</button>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='5'){quest=3;closeActivity();say('Wonderful counting! Now follow the path to Story Grove.');beep(760,.12)}else{say('Take another look. Count the fireflies slowly.');beep(250,.08)}});document.getElementById('close').onclick=closeActivity}
function openLetters(){document.getElementById('activity').style.display='grid';document.getElementById('panel').innerHTML='<div class="win">🌱</div><h2>Story Grove</h2><p>Look at the word <b>MAVENI</b>. Which letter comes after A?</p><div class="choices"><button class="choice" data-a="M">M</button><button class="choice" data-a="V">V</button><button class="choice" data-a="E">E</button><button class="choice" data-a="Z">Z</button></div><button class="close" id="close">Not now</button>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='V'){quest=4;closeActivity();say('Yes — V! Your Spark is ready for the Workshop.');beep(820,.12)}else{say('Try following the letters from left to right.');beep(250,.08)}});document.getElementById('close').onclick=closeActivity}
function closeActivity(){document.getElementById('activity').style.display='none'}
function tree(t){ctx.save();ctx.translate(t[0],t[1]);ctx.scale(t[2],t[2]);ctx.fillStyle='#795743';ctx.fillRect(-10,0,20,65);ctx.fillStyle='#5c9869';for(const z of [[-28,-4,34],[20,-10,38],[0,-38,39]]){ctx.beginPath();ctx.arc(z[0],z[1],z[2],0,TAU);ctx.fill()}ctx.restore()}
function marker(x,y,icon,label,active=false){ctx.fillStyle=active?'#fff2b8ee':'#fff8e8dd';ctx.beginPath();ctx.roundRect(x-70,y-31,140,62,16);ctx.fill();ctx.fillStyle='#486b76';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(icon,x,y+4);ctx.font='12px system-ui';ctx.fillText(label,x,y+23);ctx.textAlign='left'}
function drawWorld(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a8dcf0');g.addColorStop(.43,'#d4efd4');g.addColorStop(1,'#80b47b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#62b9dd';ctx.beginPath();ctx.moveTo(650,0);ctx.bezierCurveTo(580,180,760,270,650,410);ctx.bezierCurveTo(570,540,730,620,650,720);ctx.lineTo(790,720);ctx.bezierCurveTo(850,610,690,520,790,400);ctx.bezierCurveTo(870,260,700,170,790,0);ctx.fill();
ctx.fillStyle='#d5b78b';ctx.beginPath();ctx.moveTo(120,720);ctx.quadraticCurveTo(300,570,470,480);ctx.quadraticCurveTo(650,380,900,430);ctx.lineTo(900,510);ctx.quadraticCurveTo(650,470,500,550);ctx.quadraticCurveTo(330,650,260,720);ctx.fill();
flowers.forEach(f=>{ctx.strokeStyle='#5b9361';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x,f.y-9);ctx.stroke();ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y-11,4*f.s,0,TAU);ctx.fill()});trees.forEach(tree);
marker(points.number.x,points.number.y,'1 2 3','Number Garden',quest===2);marker(points.story.x,points.story.y,'ABC','Story Grove',quest===3);marker(points.workshop.x,points.workshop.y,'✦','Spark Workshop',quest===4);
if(quest===1){ctx.shadowColor='#ffe47b';ctx.shadowBlur=30;ctx.fillStyle='#ffe47b';ctx.beginPath();ctx.arc(points.spark.x,points.spark.y,14+Math.sin(t/160)*3,0,TAU);ctx.fill();ctx.shadowBlur=0;for(let i=0;i<6;i++){ctx.fillStyle='#fff1a1';ctx.fillRect(points.spark.x+Math.cos(t/500+i)*25,points.spark.y+Math.sin(t/500+i)*25,3,3)}}
// soft valley light
const rg=ctx.createRadialGradient(240,170,20,240,170,300);rg.addColorStop(0,'#fff7c633');rg.addColorStop(1,'#fff7c600');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)}
function drawCompanion(t){let bob=Math.sin(t/230)*5;ctx.save();ctx.translate(companion.x,companion.y+bob);ctx.fillStyle='#b8d7cf';ctx.beginPath();ctx.ellipse(0,10,27,31,0,0,TAU);ctx.fill();ctx.fillStyle='#d9e7d7';ctx.beginPath();ctx.arc(0,-17,27,0,TAU);ctx.fill();ctx.fillStyle='#9fc7be';ctx.beginPath();ctx.moveTo(-23,-34);ctx.lineTo(-38,-62);ctx.lineTo(-7,-43);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(23,-34);ctx.lineTo(38,-62);ctx.lineTo(7,-43);ctx.closePath();ctx.fill();ctx.fillStyle='#263b55';ctx.beginPath();ctx.arc(-9,-19,4,0,TAU);ctx.arc(9,-19,4,0,TAU);ctx.fill();ctx.fillStyle='#ffe27a';ctx.shadowColor='#ffe27a';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,5,7,0,TAU);ctx.fill();ctx.shadowBlur=0;if(companion.friend){ctx.strokeStyle='#fff6c4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-17,38+Math.sin(t/180)*3,Math.PI*1.05,Math.PI*1.95);ctx.stroke()}ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#526f9b';ctx.beginPath();ctx.arc(0,0,18,0,TAU);ctx.fill();ctx.fillStyle='#e8c59b';ctx.beginPath();ctx.arc(0,-15,11,0,TAU);ctx.fill();ctx.fillStyle='#fff8e8';ctx.beginPath();ctx.arc(0,9,9,0,TAU);ctx.fill();ctx.restore()}
function drawParticles(){for(let i=particles.length-1;i>=0;i--){const a=particles[i];a.x+=a.vx;a.y+=a.vy;a.vy+=.015;a.life--;ctx.globalAlpha=Math.max(0,a.life/80);ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,TAU);ctx.fill();if(a.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}
function loop(ts){const dt=Math.min(32,ts-last||16);last=ts;if(playing){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){const l=Math.hypot(dx,dy);player.x+=dx/l*4.2;player.y+=dy/l*4.2;player.face=dx||player.face}player.x=clamp(player.x,30,1250);player.y=clamp(player.y,90,680);companion.t+=dt;const followX=player.x+Math.cos(companion.t/900)*55,followY=player.y+Math.sin(companion.t/700)*35+22;companion.x+=(followX-companion.x)*.025;companion.y+=(followY-companion.y)*.025;if(toastTimer>0){toastTimer--;if(toastTimer===0)document.getElementById('toast').classList.add('hidden')}}drawWorld(ts);drawCompanion(ts);drawParticles();drawPlayer();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
