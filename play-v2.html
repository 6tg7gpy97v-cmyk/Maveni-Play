<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#173943"><title>MAVENI — First Valley v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102f38;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}button{font:inherit}.hide{display:none!important}.intro,.panel{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#102f38dd;padding:20px}.card,.box{width:min(760px,94vw);background:#fff9e9;color:#29434c;border-radius:30px;padding:28px;text-align:center;box-shadow:0 24px 90px #0008}.logo{font-size:clamp(48px,13vw,84px);font-weight:950;letter-spacing:10px;color:#4b7480}.tag{letter-spacing:5px;font-size:12px;color:#779691}.primary{border:0;border-radius:999px;padding:16px 30px;background:#6d9e88;color:#fff;font-weight:900;box-shadow:0 8px 24px #426d5b55}.hud{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.pill,.quest{background:#fff9e9e8;color:#29434c;box-shadow:0 4px 15px #0002;border-radius:18px;padding:9px 13px;font-weight:850}.quest{position:fixed;z-index:10;right:12px;top:60px;width:min(350px,calc(100vw - 24px));font-weight:700}.quest small{display:block;opacity:.7;margin-top:3px}.toast{position:fixed;z-index:30;left:50%;bottom:20px;transform:translateX(-50%);width:min(720px,calc(100vw - 28px));padding:14px 18px;background:#fff9e9f2;color:#29434c;border-radius:18px;text-align:center;font-weight:800;box-shadow:0 12px 35px #0006}.controls{display:none;position:fixed;inset:0;z-index:12;pointer-events:none}.pad{position:absolute;left:15px;bottom:16px;width:158px;height:158px;pointer-events:auto}.c{position:absolute;width:55px;height:55px;border:0;border-radius:50%;background:#fff9e9e5;color:#35525b;box-shado button id="act" class="c act">EXPLORE</button></div><button id="sound" class="sound hide">♪</button><div id="dialog" class="dialog hide"><div class="box"><div class="name">Companion 001</div><div id="words" class="words"></div><button id="next" class="primary">CONTINUE</button></div></div><div id="activity" class="panel"><div id="abox" class="box"></div></div><script>const cv=document.getElementById('g'),C=cv.getContext('2d'),W=1280,H=720,K={};let run=0,last=0,q=0,s=0,lvl=1,toast=0,audio=1,ac;const P={x:180,y:560,step:0,face:1},M={x:330,y:505,t:0,friend:0},fx=[],dust=[],time=0;const PO={spark:{x:850,y:260},number:{x:1020,y:515},story:{x:450,y:145},work:{x:650,y:595},gate:{x:1160,y:300}};const Q=[['First Steps','Meet your companion.'],['A Little Glow','Find the first Spark.'],['Number Garden','Count five fireflies.'],['Story Grove','Choose the missing letter.'],['Spark Workshop','Use your Spark at the Workshop.'],['The Valley Opens','Walk to the Whispering Path.'],['Valley Explorer','Explore the valley.']];for(let i=0;i<150;i++)fx.push({x:20+Math.random()*1240,y:100+Math.random()*600,h:i%5});for(let i=0;i<45;i++)dust.push({x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.4});function rs(){let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;C.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function toastMsg(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');toast=220}function update(){document.getElementById('sc').textContent=s;document.getElementById('lv').textContent=lvl;document.getElementById('qt').textContent=Q[q][0];document.getElementById('qx').textContent=Q[q][1]}function tone(f=600,d=.1){if(!audio)return;try{ac??=new AudioContext;ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.0001;g.gain.exponentialRampToValueAtTime(.05,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}function begin(){if(run)return;run=1;document.getElementById('intro').classList.add('hide');['hud','quest','controls','sound'].forEach(id=>document.getElementById(id).classList.remove('hide'));update();toastMsg('Meet the little blue creature near you.');tone(520,.12);setTimeout(()=>tone(720,.12),110)}document.getElementById('begin').onclick=begin;addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key===' '||e.key.toLowerCase()==='e')act()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=1};['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();K[k]=0}))});document.getElementById('act').onpointerdown=e=>{e.preventDefault();act()};document.getElementById('sound').onclick=()=>{audio=!audio;document.getElementById('sound').textContent=audio?'♪':'×';tone(600,.08)};let lines=[],li=0;function talk(a){lines=a;li=0;document.getElementById('words').textContent=a[0];document.getElementById('dialog').classList.remove('hide');tone(650,.08)}document.getElementById('next').onclick=()=>{li++;if(li>=lines.length)document.getElementById('dialog').classList.add('hide');else{document.getElementById('words').textContent=lines[li];tone(700,.07)}}function burst(x,y,n=28){for(let i=0;i<n;i++)dust.push({x,y,v:.6+Math.random()*1.8,life:60,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-1,r:2+Math.random()*4});tone(760,.12);setTimeout(()=>tone(980,.1),70)}function act(){if(!run||!document.getElementById('dialog').classList.contains('hide'))return;if(q===0&&D(P,M)<105){M.friend=1;q=1;talk(['Hello! I am Companion 001.','I heard a tiny glow near the stream.','Let us find it together!']);update()}else if(q===1&&D(P,PO.spark)<110){s++;q=2;burst(PO.spark.x,PO.spark.y);talk(['You found a Spark!','It is a little piece of wonder.','Now let us wake the Number Garden.']);update()}else if(q===2&&D(P,PO.number)<145)math();else if(q===3&&D(P,PO.story)<145)letters();else if(q===4&&D(P,PO.work)<150){q=5;burst(PO.work.x,PO.work.y,45);talk(['The Spark is happy.','Look! The valley changed.','A new path is opening.']);update()}else if(q===5&&D(P,PO.gate)<140){q=6;lvl=2;burst(PO.gate.x,PO.gate.y,55);talk(['You found the Whispering Path.','This is only the first valley.','There is much more ahead.']);update()}else toastMsg('Explore around here — something may surprise you.')}function show(h){document.getElementById('abox').innerHTML=h;document.getElementById('activity').style.display='grid'}function closeA(){document.getElementById('activity').style.display='none'}function math(){show('<h2>Number Garden</h2><p>Five fireflies are glowing. How many can you count?</p><div style="font-size:45px">✨ ✨ ✨ ✨ ✨</div><div class="choices"><button class="choice" data-a="3">3</button><button class="choice" data-a="5">5</button><button class="choice" data-a="7">7</button></div><button class="choice" id="back">Back</button>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='5'){q=3;closeA();toastMsg('Great counting! Find Story Grove.');tone(820,.12);update()}else if(!b.dataset.a)closeA();else{toastMsg('Count slowly, one firefly at a time.');tone(250,.08)}})}function letters(){show('<h2>Story Grove</h2><p>Which letter comes after A in <b>MAVENI</b>?</p><div class="choices"><button class="choice" data-a="M">M</button><button class="choice" data-a="V">V</button><button class="choice" data-a="E">E</button><button class="choice" data-a="Z">Z</button></div><button class="choice" id="back">Back</button>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='V'){q=4;closeA();toastMsg('Correct! Take your Spark to the Workshop.');tone(840,.12);update()}else if(!b.dataset.a)closeA();else{toastMsg('Read the letters from left to right.');tone(250,.08)}})}function rr(x,y,w,h,r){C.beginPath();C.roundRect(x,y,w,h,r);C.fill()}function tree(x,y,z=1){C.save();C.translate(x,y);C.scale(z,z);C.fillStyle='#73513e';C.fillRect(-9,0,18,70);C.fillStyle='#4f8e65';for(const a of [[-28,-5,34],[27,-8,38],[0,-42,40]]){C.beginPath();C.arc(a[0],a[1],a[2],0,Math.PI*2);C.fill()}C.fillStyle='#6ca575';C.beginPath();C.arc(-9,-20,18,0,Math.PI*2);C.fill();C.restore()}function marker(p,i,t,on){C.fillStyle=on?'#fff0aeee':'#fff9e9dd';rr(p.x-72,p.y-30,144,60,16);C.fillStyle='#476f78';C.textAlign='center';C.font='bold 19px system-ui';C.fillText(i,p.x,p.y+4);C.font='12px system-ui';C.fillText(t,p.x,p.y+23);C.textAlign='left'}function world(t){let g=C.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fcbe1');g.addColorStop(.42,'#cde8d0');g.addColorStop(1,'#70a66e');C.fillStyle=g;C.fillRect(0,0,W,H);C.fillStyle='#6c929d';C.beginPath();C.moveTo(0,220);C.lineTo(160,55);C.lineTo(330,205);C.lineTo(520,35);C.lineTo(700,200);C.lineTo(900,45);C.lineTo(1110,205);C.lineTo(1280,80);C.lineTo(1280,315);C.lineTo(0,315);C.fill();C.fillStyle='#55afd1';C.beginPath();C.moveTo(625,0);C.bezierCurveTo(540,160,760,250,640,405);C.bezierCurveTo(540,545,760,610,660,720);C.lineTo(815,720);C.bezierCurveTo(900,600,700,540,800,400);C.bezierCurveTo(890,260,700,150,805,0);C.fill();C.fillStyle='#d7b98c';C.beginPath();C.moveTo(0,720);C.quadraticCurveTo(250,560,480,485);C.quadraticCurveTo(690,415,920,455);C.lineTo(920,530);C.quadraticCurveTo(680,485,500,560);C.quadraticCurveTo(260,670,220,720);C.fill();for(const f of fx){C.strokeStyle='#5c9466';C.beginPath();C.moveTo(f.x,f.y);C.lineTo(f.x,f.y+10);C.stroke();C.fillStyle=['#e9b1c2','#f3d36f','#a9c7e8','#efc2a0','#c8a6e6'][f.h];C.beginPath();C.arc(f.x,f.y,3.5,0,Math.PI*2);C.fill()}[[95,160,1.2],[1040,145,1.25],[1160,480,1.1],[760,625,1.15],[520,125,1],[90,440,.9],[1110,625,.9],[350,305,.85],[900,250,.85]].forEach(a=>tree(...a));C.fillStyle='#8a684c';C.fillRect(605,555,100,58);C.fillStyle='#d49a67';C.beginPath();C.moveTo(590,555);C.lineTo(655,505);C.lineTo(720,555);C.fill();C.fillStyle='#557c8a';C.fillRect(646,572,23,41);marker(PO.number,'✿','Number Garden',q===2);marker(PO.story,'📖','Story Grove',q===3);marker(PO.work,'✦','Spark Workshop',q===4);if(q>=5)marker(PO.gate,'➜','Whispering Path',1);if(q>=1){C.save();C.translate(PO.spark.x,PO.spark.y);C.rotate(t/500);C.shadowColor='#ffe36d';C.shadowBlur=25;C.fillStyle='#fff0a0';C.beginPath();C.moveTo(0,-25);C.lineTo(9,-8);C.lineTo(26,0);C.lineTo(9,9);C.lineTo(0,26);C.lineTo(-9,9);C.lineTo(-26,0);C.lineTo(-9,-8);C.closePath();C.fill();C.restore()}/* companion */let b=Math.sin(M.t*4)*4;C.save();C.translate(M.x,M.y+b);C.fillStyle='#4c7180';C.beginPath();C.ellipse(0,13,29,23,0,0,Math.PI*2);C.fill();C.fillStyle='#82aab7';C.beginPath();C.arc(0,-17,25,0,Math.PI*2);C.fill();C.fillStyle='#41606b';C.beginPath();C.moveTo(-18,-30);C.lineTo(-34,-56);C.lineTo(-7,-41);C.moveTo(18,-30);C.lineTo(34,-56);C.lineTo(7,-41);C.fill();C.fillStyle='#fff9e9';C.beginPath();C.arc(-9,-19,6,0,Math.PI*2);C.arc(9,-19,6,0,Math.PI*2);C.fill();C.fillStyle='#27434d';C.beginPath();C.arc(-9,-19,2.5,0,Math.PI*2);C.arc(9,-19,2.5,0,Math.PI*2);C.fill();C.fillStyle='#e7b45e';C.beginPath();C.arc(0,5,7,0,Math.PI*2);C.fill();C.restore();/* player */C.save();C.translate(P.x,P.y+Math.sin(P.step)*2);if(P.face<0)C.scale(-1,1);C.fillStyle='#5c4b89';C.beginPath();C.roundRect(-22,3,44,40,14);C.fill();C.fillStyle='#f1c39c';C.beginPath();C.arc(0,-22,16,0,Math.PI*2);C.fill();C.fillStyle='#49354d';C.beginPath();C.arc(0,-30,18,Math.PI,Math.PI*2);C.fill();C.fillStyle='#f1c39c';C.beginPath();C.arc(-15,-21,5,0,Math.PI*2);C.arc(15,-21,5,0,Math.PI*2);C.fill();C.fillStyle='#fff';C.beginPath();C.arc(-5,-23,3,0,Math.PI*2);C.arc(5,-23,3,0,Math.PI*2);C.fill();C.restore();for(const z of dust){if(z.life!==undefined){C.globalAlpha=Math.max(0,z.life/60);C.fillStyle='#ffe58a';C.beginPath();C.arc(z.x,z.y,z.r||3,0,Math.PI*2);C.fill();C.globalAlpha=1}else{C.fillStyle='#fff8cc88';C.beginPath();C.arc(z.x,z.y,1.5,0,Math.PI*2);C.fill()}}}function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;if(run){time+=dt;let dx=(K.r?1:0)-(K.l?1:0),dy=(K.d?1:0)-(K.u?1:0);if(dx||dy){let n=Math.hypot(dx,dy);P.x=Math.max(35,Math.min(1245,P.x+dx/n*225*dt));P.y=Math.max(85,Math.min(690,P.y+dy/n*225*dt));P.step+=dt*10;if(dx)P.face=dx}M.t+=dt;if(M.friend&&D(P,M)>72){let a=Math.atan2(P.y-M.y,P.x-M.x);M.x+=Math.cos(a)*95*dt;M.y+=Math.sin(a)*95*dt}for(let i=dust.length-1;i>=0;i--){let z=dust[i];if(z.life!==undefined){z.x+=z.vx;z.y+=z.vy;z.vy+=.04;z.life--;if(z.life<=0)dust.splice(i,1)}}if(toast){toast--;if(!toast)document.getElementById('toast').classList.add('hide')}}world(t);requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
