name: Build Critter Pop APK

on:
  push:
    branches: [critter-pop-demo]
    paths:
      - 'critter-android/**'
      - 'critter-pop/index.html'
      - '.github/workflows/critter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: critter-pop-demo

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle stable Critter Pop game
        run: |
          mkdir -p critter-android/app/src/main/assets
          cp critter-pop/index.html critter-android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p critter-android :app:assembleDebug --stacktrace

      - name: Publish APK into repository
        run: |
          mkdir -p apk-output
          cp critter-android/app/build/outputs/apk/debug/app-debug.apk apk-output/Critter-Pop.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk-output/Critter-Pop.apk
          git diff --cached --quiet || git commit -m 'Build Critter Pop Android APK'
          git push origin HEAD:critter-pop-demo

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Critter-Pop-Android
          path: apk-output/Critter-Pop.apk
          if-no-files-found: error
