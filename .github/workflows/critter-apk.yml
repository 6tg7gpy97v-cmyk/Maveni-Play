name: Build Critter Pop APK

on:
  push:
    branches: [critter-pop-demo]
    paths:
      - 'critter-android/**'
      - 'critter-pop/apk-stable.html'
      - '.github/workflows/critter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: critter-pop-demo

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle deterministic Critter Pop game
        run: |
          mkdir -p critter-android/app/src/main/assets
          cp critter-pop/apk-stable.html critter-android/app/src/main/assets/index.html

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p critter-android :app:assembleDebug --stacktrace 2>&1 | tee /tmp/critter-build.log

      - name: Publish APK and build report
        if: always()
        run: |
          mkdir -p apk-output build-status
          {
            echo "Build step outcome: ${{ steps.build_apk.outcome }}"
            echo "Commit: $GITHUB_SHA"
            echo "Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "--- Last 120 build log lines ---"
            tail -n 120 /tmp/critter-build.log 2>/dev/null || true
          } > build-status/critter-apk-build.txt

          if [ -f critter-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp critter-android/app/build/outputs/apk/debug/app-debug.apk apk-output/Critter-Pop.apk
            echo "APK produced successfully." >> build-status/critter-apk-build.txt
          else
            echo "APK was not produced." >> build-status/critter-apk-build.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/critter-apk-build.txt
          if [ -f apk-output/Critter-Pop.apk ]; then git add apk-output/Critter-Pop.apk; fi
          git diff --cached --quiet || git commit -m 'Update Critter Pop Android build output'
          git push origin HEAD:critter-pop-demo

      - name: Upload APK artifact
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Critter-Pop-Android
          path: apk-output/Critter-Pop.apk
          if-no-files-found: error
