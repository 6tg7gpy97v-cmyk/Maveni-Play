name: Publish Critter Pop installer to main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-critter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy installer and APK from critter-pop-demo
        run: |
          git fetch origin critter-pop-demo
          git checkout origin/critter-pop-demo -- critter-pop/install/index.html apk-output/Critter-Pop.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add critter-pop/install/index.html apk-output/Critter-Pop.apk
          git diff --cached --quiet || git commit -m 'Publish Critter Pop installer and APK'
          git push origin main
