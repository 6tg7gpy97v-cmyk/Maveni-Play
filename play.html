<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#173943"><title>MAVENI — The First Valley</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173943;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}button{font:inherit}.hidden{display:none!important}.screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#123944dd;padding:20px}.card,.panel{width:min(760px,94vw);max-height:90vh;overflow:auto;background:#fff9e9;border-radius:30px;padding:28px;text-align:center;color:#29434c;box-shadow:0 25px 90px #0008}.logo{font-size:clamp(48px,13vw,82px);font-weight:950;letter-spacing:9px;color:#47727c}.tag{letter-spacing:5px;color:#7c9d99;font-size:12px}.card p{line-height:1.55}.primary{border:0;border-radius:999px;padding:16px 30px;background:#6d9e88;color:white;font-weight:900;box-shadow:0 8px 22px #456f5a55}.secondary{border:0;border-radius:999px;padding:11px 22px;background:#dfe8e1;color:#35525b;font-weight:800}.hud{position:fixed;z-index:10;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.pill,.quest{background:#fff9e9df;color:#29434c;box-shadow:0 4px 15px #0002}.pill{padding:9px 13px;border-radius:18px;font-weight:850}.quest{position:fixed;right:14px;top:61px;z-index:10;width:min(350px,calc(100vw - 28px));padding:12px 15px;border-radius:18px}.quest b{display:block}.quest small{opacity:.75}.toast{position:fixed;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);width:min(720px,calc(100vw - 30px));padding:13px 18px;border-radius:18px;background:#fff9e9f5;color:#29434c;text-align:center;font-weight:800;box-shadow:0 10px 35px #0006}.controls{display:none;position:fixed;inset:0;z-index:15;pointer-events:none}.pad{position:absolute;left:15px;bottom:18px;width:156px;height:156px;pointer-events:auto}.ctrl{position:absolute;width:54px;height:54px;border:0;border-radius:50%;background:#fff9eadb;color:#35525b;box-shadow:0 3px 13px #0004;font-size:21px;font-weight:900;touch-action:none}.up{left:51px}.left{left:0;top:51px}.right{right:0;top:51px}.down{left:51px;bottom:0}#act{right:20px;bottom:28px;width:82px;height:82px;background:#6d9e88;color:white;pointer-events:auto;font-size:13px}#menu,#sound{position:fixed;z-index:16;right:15px;width:44px;height:44px;border:0;border-radius:50%;background:#fff9e9df;color:#35525b;box-shadow:0 3px 13px #0003}#menu{top:12px}#sound{bottom:18px}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}.choice{min-width:75px;border:0;border-radius:18px;padding:16px 22px;background:#8db39e;color:white;font-size:24px;font-weight:900}.dialog{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:#12394488}.dialogbox{width:min(650px,92vw);background:#fff9e9;border-radius:28px;padding:24px;box-shadow:0 20px 80px #0008}.name{font-weight:950;color:#47727c}.words{font-size:21px;line-height:1.5;margin:10px 0 20px}@media(max-width:800px){.controls{display:block}.pill{font-size:12px;padding:8px 10px}.quest{top:58px;font-size:13px}.card,.panel{padding:21px}}</style></head><body><canvas id="game" width="1280" height="720"></canvas><section id="start" class="screen"><div class="card"><div class="logo">MAVENI</div><div class="tag">WHERE WONDER GROWS</div><p>A gentle living world built around curiosity, friendship and discovery.</p><button id="begin" class="primary">Enter the Valley</button><p style="font-size:12px;opacity:.7">Landscape is recommended on phones.</p></div></section><div id="hud" class="hud hidden"><div class="pill">✦ Sparks <span id="sparks">0</span></div><div class="pill">⭐ Level <span id="level">1</span></div></div><div id="quest" class="quest hidden"><b id="qtitle">First Steps</b><small id="qtext">Meet your companion.</small></div><button id="menu" class="hidden">☰</button><button id="sound" class="hidden">♪</button><div id="controls" class="controls hidden"><div class="pad"><button class="ctrl up" data-k="up">▲</button><button class="ctrl left" data-k="left">◀</button><button class="ctrl right" data-k="right">▶</button><button class="ctrl down" data-k="down">▼</button></div><button id="act" class="ctrl">EXPLORE</button></div><div id="toast" class="toast hidden"></div><section id="dialog" class="dialog hidden"><div class="dialogbox"><div id="dname" class="name">Companion 001</div><div id="dtext" class="words"></div><button id="dnext" class="primary">Continue</button></div></section><section id="activity" class="screen hidden"><div id="activityPanel" class="panel"></div></section><section id="pause" class="screen hidden"><div class="panel"><h2>MAVENI</h2><div class="choices"><button id="resume" class="choice">▶ Resume</button><button id="restart" class="choice">↻ Restart</button></div></div></section><script>const c=document.getElementById('game'),x=c.getContext('2d'),W=1280,H=720,K={};let running=false,last=0,quest=0,spark=0,xp=0,level=1,audio=true,toastT=0,dialog=[],di=0;const p={x:220,y:550},m={x:330,y:510,t:0,friend:false},pts={spark:{x:850,y:260},number:{x:1020,y:520},story:{x:445,y:145},work:{x:650,y:600},gate:{x:1160,y:300}};const trees=[[90,150,1.2],[1040,125,1.3],[1160,475,1.1],[760,620,1.15],[520,110,1],[90,430,.9],[1110,625,.9],[350,300,.85],[900,245,.85]];const flowers=[];for(let i=0;i<150;i++)flowers.push({x:20+Math.random()*1240,y:90+Math.random()*630,c:['#e9b3c3','#f4d06f','#a8c7e6','#f2c5a0','#d4a9e8'][i%5]});const parts=[];const Q=[['First Steps','Meet your companion.'],['A Little Glow','Find the first Spark.'],['Number Garden','Count five fireflies.'],['Story Grove','Choose the missing letter.'],['Spark Workshop','Use your Spark at the Workshop.'],['The Valley Opens','Walk to the new path.'],['Valley Explorer','Explore the First Valley.']];function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function update(){document.getElementById('sparks').textContent=spark;document.getElementById('level').textContent=level;document.getElementById('qtitle').textContent=Q[quest][0];document.getElementById('qtext').textContent=Q[quest][1]}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');toastT=220}let ac;function tone(f,d=.1){if(!audio)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.05,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}function start(){running=true;document.getElementById('start').classList.add('hidden');['hud','quest','controls','menu','sound'].forEach(id=>document.getElementById(id).classList.remove('hidden'));update();toast('Walk to your little blue companion.');tone(520,.12);setTimeout(()=>tone(720,.12),100)}document.getElementById('begin').onclick=start;addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e'||e.key===' ')interact()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;let d=e=>{e.preventDefault();K[k]=1},u=e=>{e.preventDefault();K[k]=0};b.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,u))});document.getElementById('act').onpointerdown=e=>{e.preventDefault();interact()};document.getElementById('sound').onclick=()=>{audio=!audio;document.getElementById('sound').textContent=audio?'♪':'×';if(audio)tone(600,.08)};document.getElementById('menu').onclick=()=>document.getElementById('pause').classList.remove('hidden');document.getElementById('resume').onclick=()=>document.getElementById('pause').classList.add('hidden');document.getElementById('restart').onclick=()=>location.reload();function say(a){dialog=a;di=0;document.getElementById('dtext').textContent=a[0];document.getElementById('dialog').classList.remove('hidden');tone(650,.08)}document.getElementById('dnext').onclick=()=>{di++;if(di>=dialog.length)document.getElementById('dialog').classList.add('hidden');else{document.getElementById('dtext').textContent=dialog[di];tone(700,.07)}}function collect(X,Y){for(let i=0;i<25;i++)parts.push({x:X,y:Y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,life:70,r:2+Math.random()*4});tone(760,.1);setTimeout(()=>tone(980,.1),70)}function interact(){if(!running||!document.getElementById('dialog').classList.contains('hidden'))return;if(quest===0&&D(p,m)<105){m.friend=true;quest=1;say(['Hello! I am Companion 001.','I heard a tiny glow near the stream.','Let us find it together!']);toast('New goal: find the Spark.');update()}else if(quest===1&&D(p,pts.spark)<105){spark++;xp+=20;quest=2;collect(pts.spark.x,pts.spark.y);say(['You found a Spark!','It is a little piece of wonder.','Let us visit the Number Garden.']);update()}else if(quest===2&&D(p,pts.number)<140)math();else if(quest===3&&D(p,pts.story)<140)letters();else if(quest===4&&D(p,pts.work)<145){quest=5;xp+=40;collect(pts.work.x,pts.work.y);collect(pts.work.x,pts.work.y);say(['Look what happened!','Your Spark helped the valley wake up.','A new path is ready.']);update()}else if(quest===5&&D(p,pts.gate)<135){quest=6;level=2;xp+=60;say(['You found the Whispering Path.','This is only the first valley.','There are many more discoveries ahead.']);update()}else toast('Nothing to do here yet. Keep exploring.')}function panel(html){document.getElementById('activityPanel').innerHTML=html;document.getElementById('activity').classList.remove('hidden')}function closePanel(){document.getElementById('activity').classList.add('hidden')}function math(){panel('<h2>Number Garden</h2><p>Five fireflies are glowing. How many can you count?</p><div style="font-size:42px">✨ ✨ ✨ ✨ ✨</div><div class="choices"><button class="choice" data-a="3">3</button><button class="choice" data-a="5">5</button><button class="choice" data-a="7">7</button></div><button class="secondary" onclick="closePanel()">Back</button>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='5'){quest=3;xp+=25;closePanel();toast('Great counting! Now find Story Grove.');tone(820,.12);update()}else{toast('Count them slowly, one by one.');tone(250,.08)}})}function letters(){panel('<h2>Story Grove</h2><p>Which letter comes after A in <b>MAVENI</b>?</p><div class="choices"><button class="choice" data-a="M">M</button><button class="choice" data-a="V">V</button><button class="choice" data-a="E">E</button><button class="choice" data-a="Z">Z</button></div><button class="secondary" onclick="closePanel()">Back</button>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.a==='V'){quest=4;xp+=25;closePanel();toast('Wonderful! Take the Spark to the Workshop.');tone(840,.12);update()}else{toast('Read the letters from left to right.');tone(250,.08)}})}function tree(t){x.save();x.translate(t[0],t[1]);x.scale(t[2],t[2]);x.fillStyle='#765443';x.fillRect(-9,0,18,65);x.fillStyle='#5d9b69';for(let q of [[-30,-5,35],[27,-8,38],[0,-42,40]]){x.beginPath();x.arc(q[0],q[1],q[2],0,Math.PI*2);x.fill()}x.restore()}function label(X,Y,i,s,on=false){x.fillStyle=on?'#fff0b4ee':'#fff9e9dd';x.beginPath();x.roundRect(X-70,Y-28,140,55,14);x.fill();x.fillStyle='#355b63';x.textAlign='center';x.font='bold 18px system-ui';x.fillText(i,X,Y+2);x.font='12px system-ui';x.fillText(s,X,Y+21);x.textAlign='left'}function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a8ddf0');g.addColorStop(.5,'#d9f0d0');g.addColorStop(1,'#7fb57a');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#7198a1';x.beginPath();x.moveTo(0,190);x.lineTo(180,40);x.lineTo(340,180);x.lineTo(520,25);x.lineTo(700,180);x.lineTo(890,45);x.lineTo(1100,190);x.lineTo(1280,80);x.lineTo(1280,300);x.lineTo(0,300);x.fill();x.fillStyle='#62b7d5';x.beginPath();x.moveTo(610,0);x.bezierCurveTo(540,150,760,245,640,390);x.bezierCurveTo(520,540,760,610,650,720);x.lineTo(820,720);x.bezierCurveTo(900,610,700,535,800,400);x.bezierCurveTo(900,260,700,150,800,0);x.fill();x.fillStyle='#d8bb8f';x.beginPath();x.moveTo(120,720);x.quadraticCurveTo(300,570,480,500);x.quadraticCurveTo(650,420,900,440);x.lineTo(900,520);x.quadraticCurveTo(650,480,500,560);x.quadraticCurveTo(320,650,260,720);x.fill();flowers.forEach(f=>{x.strokeStyle='#5d9367';x.beginPath();x.moveTo(f.x,f.y);x.lineTo(f.x,f.y+9);x.stroke();x.fillStyle=f.c;x.beginPath();x.arc(f.x,f.y,3.5,0,Math.PI*2);x.fill()});trees.forEach(tree);x.fillStyle='#8b6a4e';x.fillRect(610,555,95,55);x.fillStyle='#d39b68';x.beginPath();x.moveTo(595,555);x.lineTo(657,510);x.lineTo(720,555);x.fill();x.fillStyle='#5f8d9a';x.fillRect(645,570,24,40);label(1020,520,'✿','Number Garden',quest===2);label(445,140,'📖','Story Grove',quest===3);label(650,645,'✦','Spark Workshop',quest===4);if(quest>=5)label(1160,300,'➜','Whispering Path',true);if(quest>=1){let s=pts.spark;x.save();x.translate(s.x,s.y);x.rotate(Date.now()/700);x.fillStyle='#fff0a0';x.shadowColor='#ffe36a';x.shadowBlur=25;x.beginPath();x.moveTo(0,-22);x.lineTo(8,-7);x.lineTo(24,0);x.lineTo(8,8);x.lineTo(0,24);x.lineTo(-8,8);x.lineTo(-24,0);x.lineTo(-8,-7);x.closePath();x.fill();x.restore()}let bob=Math.sin(m.t*3)*3;x.save();x.translate(m.x,m.y+bob);x.fillStyle='#6b8591';x.beginPath();x.ellipse(0,10,25,21,0,0,Math.PI*2);x.fill();x.fillStyle='#88a9b4';x.beginPath();x.arc(0,-15,23,0,Math.PI*2);x.fill();x.fillStyle='#46636d';x.beginPath();x.moveTo(-18,-28);x.lineTo(-31,-52);x.lineTo(-7,-39);x.moveTo(18,-28);x.lineTo(31,-52);x.lineTo(7,-39);x.fill();x.fillStyle='#fff9ea';x.beginPath();x.arc(-8,-18,5,0,Math.PI*2);x.arc(8,-18,5,0,Math.PI*2);x.fill();x.fillStyle='#314a52';x.beginPath();x.arc(-8,-18,2,0,Math.PI*2);x.arc(8,-18,2,0,Math.PI*2);x.fill();x.restore();x.save();x.translate(p.x,p.y);x.fillStyle='#7556a5';x.beginPath();x.arc(0,8,22,0,Math.PI*2);x.fill();x.fillStyle='#f0c19c';x.beginPath();x.arc(0,-20,15,0,Math.PI*2);x.fill();x.fillStyle='#4d354d';x.beginPath();x.arc(0,-28,17,Math.PI,Math.PI*2);x.fill();x.fillStyle='#5e7890';x.fillRect(-18,12,36,30);x.restore();parts.forEach(z=>{x.globalAlpha=Math.max(0,z.life/70);x.fillStyle='#ffe58a';x.beginPath();x.arc(z.x,z.y,z.r,0,Math.PI*2);x.fill();x.globalAlpha=1})}function tick(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;if(running){let dx=(K.right?1:0)-(K.left?1:0),dy=(K.down?1:0)-(K.up?1:0);if(dx||dy){let n=Math.hypot(dx,dy);p.x=clamp(p.x+dx/n*220*dt,35,1245);p.y=clamp(p.y+dy/n*220*dt,80,690)}m.t+=dt;if(m.friend&&D(p,m)>70){let a=Math.atan2(p.y-m.y,p.x-m.x);m.x+=Math.cos(a)*90*dt;m.y+=Math.sin(a)*90*dt}parts.forEach(z=>{z.x+=z.vx;z.y+=z.vy;z.vy+=.03;z.life--});for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);if(toastT>0){toastT--;if(!toastT)document.getElementById('toast').classList.add('hidden')}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></body></html>
